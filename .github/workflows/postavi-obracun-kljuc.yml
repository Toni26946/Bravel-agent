name: Postavi OBRACUN_KLJUC

# Jednokratno/ručno: postavi fly secret OBRACUN_KLJUC za bravel-radni-nalozi.
# Vrijednost se prosljeđuje kao input i ide kroz env (ne ispisuje se u log).
on:
  workflow_dispatch:
    inputs:
      vrijednost:
        description: "Vrijednost za OBRACUN_KLJUC"
        required: true

env:
  FLY_APP: bravel-radni-nalozi

jobs:
  postavi:
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Postavi secret
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN2 }}
          VRIJEDNOST: ${{ inputs.vrijednost }}
        run: |
          flyctl secrets set OBRACUN_KLJUC="$VRIJEDNOST" -a "$FLY_APP"
          echo "OBRACUN_KLJUC postavljen."
