name: Testovi
on:
  push:
    branches:
      - main
    # Testovi bota ne trebaju kad se mijenjaju samo Radni nalozi (oni imaju svoje
    # testove u „Deploy Radni Nalozi") — štedi Actions minute.
    paths-ignore:
      - 'radni-nalozi/**'
      - '.github/workflows/fly-deploy-radni-nalozi.yml'
      - '.github/workflows/prezentacija.yml'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'radni-nalozi/**'
      - '.github/workflows/fly-deploy-radni-nalozi.yml'
      - '.github/workflows/prezentacija.yml'
      - '**/*.md'
  workflow_dispatch:   # rucno pokretanje
concurrency:
  group: testovi-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unittest:
    name: Python unittest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Testovi diraju samo cistu logiku benzinske.py; jedina vanjska ovisnost
      # potrebna za import je 'requests' (monitoring.py je cisti stdlib).
      - name: Instaliraj ovisnosti
        run: pip install requests

      - name: Pokreni testove
        run: python -m unittest discover -s tests -v

  # Testovi za „radni-nalozi" backend (i sintaksa .ps1 skripti za Cartec valjke) vrte se
  # u workflowu „Deploy Radni Nalozi" (fly-deploy-radni-nalozi.yml), kao vrata prije deploya.
