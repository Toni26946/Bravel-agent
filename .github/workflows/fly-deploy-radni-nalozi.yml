name: Deploy Radni Nalozi

# Deploya zasebnu aplikaciju "Bravel Radni Nalozi" (mapa radni-nalozi/) na fly.io.
# Prvo vrti testove (SQLite + Postgres smoke); deploy ide SAMO ako testovi prođu.
# Na pull requestu se vrte samo testovi (deploy se preskače) — za provjeru prije mergea.
#
# PREDUVJET (jednokratno, lokalno — jer fly token zbog SSO-a ne smije kreirati app):
#   fly apps create bravel-radni-nalozi
#   fly volumes create nalozi_data -a bravel-radni-nalozi -r ams -s 1 -y
#   fly secrets set JWT_SECRET=<nasumično> -a bravel-radni-nalozi
#   fly tokens create deploy -a bravel-radni-nalozi   → vrijednost ide u GitHub secret FLY_API_TOKEN2
on:
  push:
    branches:
      - main
    paths:
      - 'radni-nalozi/**'
      - '.github/workflows/fly-deploy-radni-nalozi.yml'
  pull_request:
    paths:
      - 'radni-nalozi/**'
      - '.github/workflows/fly-deploy-radni-nalozi.yml'
  workflow_dispatch:

env:
  FLY_APP: bravel-radni-nalozi

jobs:
  # Vrata prije deploya: testovi se vrte i na SQLiteu (brzo, izolirano) i na PRAVOM
  # Postgresu (smoke, test_postgres_smoke.py). Produkcija je Postgres, a Postgres je
  # stroži od SQLitea (npr. SELECT DISTINCT nad JSON stupcem puca) — ovo hvata tu klasu
  # grešaka PRIJE objave, umjesto da mehaničar dobije 500 uživo.
  testovi:
    name: Testovi (SQLite + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instaliraj ovisnosti
        run: pip install -r radni-nalozi/backend/requirements.txt pytest

      # TEST_DATABASE_URL uključuje Postgres smoke-test (test_postgres_smoke.py);
      # ostali testovi i dalje rade na vlastitom in-memory SQLiteu.
      - name: Pokreni testove
        env:
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test
        run: python -m pytest radni-nalozi/backend/tests -q

  deploy:
    name: Deploy Radni Nalozi
    needs: testovi
    # Na pull requestu se ne deploya — samo testovi (gornji job).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency: deploy-radni-nalozi
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - uses: docker/setup-buildx-action@v3

      - name: Prijava na Fly registry
        uses: docker/login-action@v3
        with:
          registry: registry.fly.io
          username: x
          password: ${{ secrets.FLY_API_TOKEN2 }}

      # Build iz mape radni-nalozi/ (tamo su Dockerfile, backend/, frontend/).
      - name: Build i push (GitHub Actions layer cache)
        uses: docker/build-push-action@v6
        with:
          context: ./radni-nalozi
          push: true
          tags: registry.fly.io/${{ env.FLY_APP }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy gotove slike
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN2 }}
          # Poruka commita ide kroz env (ne izravno u skriptu) — sigurno od navodnika.
          COMMIT_PORUKA: ${{ github.event.head_commit.message }}
        run: |
          # „Što je novo" za push korisnicima: prvi redak commita bez prefiksa „Radni nalozi:".
          NOVO=$(printf '%s\n' "$COMMIT_PORUKA" | head -n 1 | sed -E 's/^Radni nalozi:[[:space:]]*//' | cut -c1-200)
          flyctl deploy \
            --app "$FLY_APP" \
            --config radni-nalozi/fly.toml \
            --image registry.fly.io/${FLY_APP}:${{ github.sha }} \
            --env APP_VERZIJA=${{ github.sha }} \
            --env "APP_NOVO=$NOVO"
