app = "bravel-radni-nalozi"
primary_region = "ams"

[build]

[env]
  PORT = "8080"
  FRONTEND_DIST = "/app/static"
  UPLOAD_DIR = "/app/data/uploads"
  # Zadano SQLite na trajnom volumenu. Za Postgres postavi tajnu DATABASE_URL.
  DATABASE_URL = "sqlite:////app/data/radni_nalozi.db"
  CORS_ORIGINS = "https://nalozibravel.zgdata.hr,https://bravel-radni-nalozi.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "nalozi_data"
  destination = "/app/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
