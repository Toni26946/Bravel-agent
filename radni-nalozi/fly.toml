app = "bravel-radni-nalozi"
primary_region = "ams"

[build]

[env]
  PORT = "8080"
  FRONTEND_DIST = "/app/static"
  UPLOAD_DIR = "/app/data/uploads"
  # Zadano SQLite na trajnom volumenu. Za Postgres postavi tajnu DATABASE_URL.
  DATABASE_URL = "sqlite:////app/data/radni_nalozi.db"
  CORS_ORIGINS = "https://nalozibravel.zgdata.hr,https://bravel-radni-nalozi.fly.dev"
  # Radiona (Vrbovec) — geokrug za Flota OS GPS nadzor. Koordinate nisu tajna.
  RADIONA_LAT = "45.874889"
  RADIONA_LON = "16.414278"
  RADIONA_RADIUS_M = "2000"
  # Kraj smjene (pon–pet 15:00, sub 14:00): mehaničaru koji radi ide poruka s linkom na
  # zadatak → ✅ Gotovo / ⏸ Nije gotovo / Ostajem dulje (Toni 19.11.2026.).
  KRAJ_SMJENE_ON = "1"

[http_service]
  internal_port = 8080
  force_https = true
  # Stroj se NIKAD ne gasi — app mora biti stalno dostupan (bez ~20 s hladnog
  # starta koji je izgledao kao pad) i pozadinski Flota OS GPS nadzor mora teći
  # neprekidno. Auto-stop isključen; jedan stroj uvijek radi.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "nalozi_data"
  destination = "/app/data"

# performance-1x (vlastita jezgra) od 16.11.2026. — na shared-cpu-1x je pod pollingom
# Plana CPU bio prigušen: odgovori po 20+ s, liječnik restarta, start ~50 s → 502.
[[vm]]
  size = "performance-1x"
  memory = "2048mb"
