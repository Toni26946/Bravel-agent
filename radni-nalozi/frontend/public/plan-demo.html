<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plan radione</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
  /* Layout: traka na vrhu + jedan od tri pogleda (Poslovođa / Mehaničar / Dashboard).
     Stanje je zajedničko — akcija u jednom pogledu odmah se vidi u drugom. */
  :root{
    color-scheme:light;   /* uvijek svijetlo — da se slaže s ostatkom appa */
    --bg:#eef1f6; --card:#ffffff; --fg:#111826; --muted:#5b6678; --line:#dde3ec;
    --plava:#1e51c7; --plava-soft:#e7edfb;
    --crveno:#c0271f; --crveno-bg:#fdecea;
    --s-plan:#64748b; --s-plan-bg:#eef1f5;
    --s-ceka:#b45309; --s-ceka-bg:#fdf1dd;
    --s-radu:#15803d; --s-radu-bg:#e4f5e8;
    --s-gotovo:#0369a1; --s-gotovo-bg:#e2f1fb;
    --font:"Manrope",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.4;
    display:flex;flex-direction:column;overflow:hidden}
  h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em}
  button{font-family:inherit;cursor:pointer}
  .tnum{font-variant-numeric:tabular-nums}

  /* --- Gornja traka --- */
  header{background:var(--plava);color:#fff;flex:none;
    padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .brand{font-weight:800;font-size:16px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
  .brand .proto{font-size:10px;font-weight:700;background:rgba(255,255,255,.22);padding:2px 7px;border-radius:20px;letter-spacing:.06em}
  .datum{font-size:12px;opacity:.9;margin-left:auto}
  .tabs{display:flex;gap:6px;background:var(--plava);flex:none;padding:0 12px 10px;flex-wrap:wrap}
  .tab{border:0;background:rgba(255,255,255,.16);color:#fff;padding:8px 14px;border-radius:999px;font-weight:700;font-size:13px}
  .tab.akt{background:#fff;color:var(--plava)}

  main{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px;padding-block:16px}
  .wrap{max-width:1040px;margin:0 auto}
  .hint{color:var(--muted);font-size:12.5px;margin:0 0 12px}

  /* --- Kartice / zajedničko --- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .sek-nas{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:18px 2px 8px}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
  .c-plan{color:var(--s-plan);background:var(--s-plan-bg)}
  .c-ceka{color:var(--s-ceka);background:var(--s-ceka-bg)}
  .c-radu{color:var(--s-radu);background:var(--s-radu-bg)}
  .c-gotovo{color:var(--s-gotovo);background:var(--s-gotovo-bg)}
  .btn{border:0;border-radius:10px;padding:8px 12px;font-weight:700;font-size:13px;background:var(--plava);color:#fff}
  .btn.ghost{background:var(--plava-soft);color:var(--plava)}
  .btn.sm{padding:6px 10px;font-size:12px}
  .btn.zvj{background:#fff7ed;color:#b45309;border:1px solid #fed7aa}
  .btn:disabled{opacity:.45;cursor:default}
  select{font-family:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:9px;padding:6px 8px;background:var(--card);color:var(--fg)}
  .gb{font-weight:800;font-size:15px}
  /* Samo zaglavlje (GB linija) vodi na nalog; operacije ostaju za rad. */
  .nhead.gb-head{cursor:pointer}
  .dcard{cursor:pointer}
  .vozilo{color:var(--muted);font-weight:600;font-size:12.5px}

  /* --- Poslovođa --- */
  .pl-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .zak-traka{background:#fef3c7;border:1px solid #fde68a;color:#92400e;border-radius:10px;padding:8px 12px;margin:0 0 10px;font-size:12.5px;font-weight:700}
  .pl-top .brojac{margin-left:auto;font-size:12.5px;color:var(--muted);font-weight:700}
  .brojac-btn{margin-left:auto;background:var(--plava-soft);color:var(--plava);border:0;border-radius:999px;padding:6px 12px;font-weight:700;font-size:12.5px;cursor:pointer}
  .plan-maker{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--plava-soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 10px}
  .plan-maker .pm-lbl{font-size:11px;font-weight:700;color:var(--plava)}
  .plan-maker input{flex:1;min-width:110px;max-width:180px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font:inherit;font-size:13px;font-weight:700;background:var(--card);color:var(--fg)}
  .plan-maker .btn{font-size:11px;padding:5px 9px}
  .log-pop{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 8px}
  .log-h{font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
  .log-row{font-size:12.5px;padding:5px 0;border-top:1px dashed var(--line);display:flex;gap:10px}
  .log-t{color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;flex:none}
  .nalog{display:flex;gap:12px;margin-bottom:10px}
  .rang{flex:none;width:30px;height:30px;border-radius:9px;background:var(--plava);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
  .nalog.dim .rang{background:var(--s-plan)}
  .nbody{flex:1;min-width:0}
  .nhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .arrows{margin-left:auto;display:flex;gap:4px}
  .arrows button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;width:28px;height:26px;font-size:13px;line-height:1}
  .op{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:5px 0;border-top:1px dashed var(--line)}
  .op .opn{font-weight:600;font-size:12px;line-height:1.3;min-width:150px;flex:1;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .op .opk{color:var(--muted);font-size:10.5px;font-weight:700}
  .op .opmeh{font-size:11px;font-weight:700;color:var(--plava);white-space:nowrap}
  .op .opmeh-btn{border:1px solid var(--line);background:var(--plava-soft);border-radius:999px;padding:3px 9px;cursor:pointer;font-family:inherit}
  .op .opmeh-btn:hover{border-color:var(--plava)}
  .op .right{margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  /* Uže kontrole da opis operacije dobije više prostora */
  .op .right select{max-width:108px;font-size:11px;padding:5px 6px}
  .op .right .btn{font-size:11px;padding:5px 8px}
  .op .right .zvj{max-width:104px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lane-hitno{border-color:var(--crveno)}
  .lane-hitno .rang{background:var(--crveno)}
  .hitno-head{color:var(--crveno)}
  .htag{color:var(--crveno);background:var(--crveno-bg)}
  .waitc,.waitc2{color:var(--muted);background:var(--s-plan-bg);font-weight:700}
  .xrem{border:1px solid var(--line);background:var(--card);color:var(--crveno);border-radius:7px;width:24px;height:24px;font-size:12px;line-height:1;cursor:pointer}
  .prog{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin:7px 0 3px}
  .prog-bar{height:100%;background:var(--s-radu);border-radius:999px;transition:width .3s}
  .prog-lbl{font-size:11px;color:var(--muted);font-weight:700}
  .arrows button.htog{color:var(--crveno);font-size:12px}
  .arrows button.htog.on{background:var(--crveno);border-color:var(--crveno)}

  /* --- Mehaničar (mobitel) --- */
  .phone-sel{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .phone{max-width:380px;margin:0 auto;border:1px solid var(--line);border-radius:22px;background:var(--card);overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.10)}
  .ph-top{background:var(--plava);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:8px}
  .ph-top .who{font-weight:800}
  .ph-top .mini{font-size:11px;opacity:.9;margin-left:auto}
  .ph-body{padding:12px 14px 18px;display:flex;flex-direction:column;gap:10px;min-height:280px}
  .notif{border:1px solid var(--s-ceka);background:var(--s-ceka-bg);border-radius:12px;padding:10px 12px}
  .notif .nt{font-weight:800;color:var(--s-ceka);font-size:12px;letter-spacing:.03em;display:flex;align-items:center;gap:6px}
  .op-card{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
  .op-card .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .op-card .big{font-size:22px;font-weight:800}
  .op-card.radu{border-color:var(--s-radu)}
  .ph-prazno{color:var(--muted);text-align:center;padding:26px 8px}

  /* --- Dashboard --- */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin-bottom:14px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .kpi .n{font-size:26px;font-weight:800;line-height:1}
  .kpi .l{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-top:4px}
  .kpi .n.radu{color:var(--s-radu)}
  .kol-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .kol{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0}
  .kol h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:8px}
  .kol h3 .dot{width:8px;height:8px;border-radius:50%}
  .dcard{border:1px solid var(--line);border-radius:10px;padding:8px 9px;margin-bottom:8px}
  .dcard .g{font-weight:800;font-size:13px}
  .dcard .o{font-size:12px;margin-top:1px}
  .dcard .m{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .live{font-weight:800;color:var(--s-radu)}

  /* --- Radnici (red po mehaničaru) --- */
  .rad-scroll{overflow-x:auto;padding-bottom:6px}
  .rad-tbl{display:flex;flex-direction:column;gap:8px;min-width:min-content}
  .rad-row{display:flex;align-items:stretch;gap:8px}
  .rad-ime{flex:none;width:168px;position:sticky;left:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-weight:800;font-size:12.5px;display:flex;align-items:center;gap:6px;z-index:2}
  .rad-ime.malo{border-color:var(--s-ceka);color:var(--s-ceka);background:var(--s-ceka-bg)}
  .rad-br{margin-left:auto;background:var(--plava-soft);color:var(--plava);border-radius:999px;padding:1px 9px;font-size:11px;font-weight:800}
  .rad-ime.malo .rad-br{background:#fff;color:var(--s-ceka)}
  .rad-cells{display:flex;gap:8px}
  .rad-cell{flex:none;width:152px;border:1px solid var(--line);border-radius:10px;padding:7px 9px 8px;background:var(--card);cursor:pointer;display:flex;flex-direction:column;gap:4px;position:relative}
  .rad-cell.c-radu{border-color:var(--s-radu)}
  .rad-cell .rc-poz{position:absolute;top:5px;right:8px;font-size:10px;font-weight:800;color:var(--muted)}
  .rad-cell .rc-gb{font-weight:800;font-size:13px}
  .rad-cell .rc-op{font-size:11px;color:var(--muted);line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  .foot{color:var(--muted);font-size:11.5px;text-align:center;margin:20px 0 4px}
  .modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
  .modal-box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;max-width:360px;width:100%;display:flex;flex-direction:column;gap:9px;box-shadow:0 18px 50px rgba(0,0,0,.4)}
  .modal-t{font-weight:800;font-size:16px}
  .modal-sub{color:var(--muted);font-size:13px;margin-bottom:4px}
  .modal-box .btn{width:100%}
  .btn.ok{background:var(--s-radu);color:#fff}
  .btn.warn{background:var(--s-ceka-bg);color:var(--s-ceka)}
  .btn.danger{background:var(--crveno-bg);color:var(--crveno)}
  .modal-x{background:none;border:0;color:var(--muted);font-weight:700;padding:6px;cursor:pointer}

  @media (max-width:760px){
    .kpis{grid-template-columns:repeat(2,1fr)}
    .kol-grid{grid-template-columns:1fr;gap:12px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  [hidden]{display:none!important}
</style>
</head>
<body>


<header>
  <div class="brand">🔧 Bravel · Plan radione <span class="proto">PROTOTIP</span></div>
  <div class="datum" id="datum"></div>
</header>
<nav class="tabs" id="tabs">
  <button class="tab akt" data-v="pl">👷‍♂️ Poslovođa</button>
  <button class="tab" data-v="meh">📱 Mehaničar</button>
  <button class="tab" data-v="dash">👷 Radnici</button>
</nav>

<main>
  <div class="wrap">
    <section id="v-pl" hidden></section>
    <section id="v-meh" hidden></section>
    <section id="v-dash" hidden></section>
    <div class="foot">Plan radione — spojeno na stvarne naloge. Vidljivo samo vlasniku. Osvježava se automatski.</div>
  </div>
</main>

<div class="modal-ov" id="modal" hidden>
  <div class="modal-box">
    <div class="modal-t">Razlog prekida operacije</div>
    <div class="modal-sub" id="modal-sub"></div>
    <button class="btn ok" onclick="PLAN.chooseStop('gotovo')">✅ Gotovo</button>
    <button class="btn warn" onclick="PLAN.chooseStop('nije')">⏸ Nije gotovo</button>
    <button class="btn danger" onclick="PLAN.chooseStop('dijelovi')">⛔ Nema dijelova</button>
    <button class="modal-x" onclick="PLAN.closeStop()">Odustani</button>
  </div>
</div>

<script>
(function(){
  "use strict";
  var MEH = [];           // mehaničari — iz API-ja
  var nalozi = [];        // nalozi/operacije — iz API-ja
  var promjeneLog = [];   // dnevnik promjena plana (churn) — iz API-ja
  var promjene = 0;
  var logOtvoren = false;
  var _planMode = false;
  var planZakljucan = false;   // stvarno stanje sa servera (zaključano za danas)
  var zakljucaoIme = "", zakljucanoTs = null;
  var prikazMeh = null;        // koga gledamo u mobitel-pogledu
  var pogled = "pl";
  var MAX_HITNO = 3;

  function meh(id){ for(var i=0;i<MEH.length;i++) if(MEH[i].id===id) return MEH[i]; return {ime:""}; }

  // --- API (isti origin → token iz app localStorage) ---
  function token(){ try { return localStorage.getItem("token"); } catch(_){ return null; } }
  function api(path, method, body){
    var h={"Content-Type":"application/json"}; var t=token(); if(t) h.Authorization="Bearer "+t;
    return fetch("/api/plan"+path, { method:method||"GET", headers:h, body: body!==undefined?JSON.stringify(body):undefined })
      .then(function(r){ if(!r.ok) return r.json().catch(function(){return {};}).then(function(j){ throw new Error(j.detail||("Greška "+r.status)); }); return r.json().catch(function(){return {};}); });
  }
  var _busy=false;
  // Potpis strukture plana — ako se ne promijeni, periodično osvježavanje NEĆE
  // precrtavati popis (inače se izbornik/gumb sruši ispod prsta pa klik propadne).
  var _lastSig=null;
  function planSig(d){
    return JSON.stringify({
      z:!!d.zakljucan, p:(d.promjene||[]).length,
      m:(d.mehanicari||[]).map(function(x){return x.id;}),
      n:(d.nalozi||[]).map(function(n){return [n.id,n.rang,n.hitno?1:0,n.cekaDijelove?1:0,
          (n.ops||[]).map(function(o){return [o.id,o.status,o.mehId,o.radioId];})];})
    });
  }
  function ucitaj(force){
    return api("").then(function(d){
      MEH=d.mehanicari||[]; nalozi=d.nalozi||[]; promjeneLog=d.promjene||[]; promjene=promjeneLog.length;
      planZakljucan=!!d.zakljucan; zakljucaoIme=d.zakljucaoIme||""; zakljucanoTs=d.zakljucanoTs||null;
      if(prikazMeh===null && MEH.length) prikazMeh=MEH[0].id;
      var s=planSig(d);
      if(!force && s===_lastSig) return;   // ništa strukturno novo → ne precrtavaj
      _lastSig=s; render();
    }).catch(function(e){ toast(e.message||"Greška pri učitavanju"); });
  }
  function act(p, body){ if(_busy) return; _busy=true; return api(p,"POST",body).then(function(){ return ucitaj(true); }).catch(function(e){ toast(e.message||"Greška"); }).then(function(){ _busy=false; }); }

  // --- pomoćno ---
  function svabOps(){ var a=[]; nalozi.forEach(function(n){ n.ops.forEach(function(o){ a.push({n:n,o:o}); }); }); return a; }
  function nalByOp(opId){ for(var i=0;i<nalozi.length;i++){var n=nalozi[i];for(var j=0;j<n.ops.length;j++) if(n.ops[j].id===opId) return n;} return null; }
  function trajanje(sek){ sek=Math.max(0,Math.floor(sek)); var h=Math.floor(sek/3600),m=Math.floor((sek%3600)/60),s=sek%60; var p=function(x){return(x<10?"0":"")+x;}; return h>0? h+":"+p(m)+":"+p(s) : m+":"+p(s); }
  function zivoSek(o){ return (o.akumSek||0) + (o.startTs? (Date.now()-o.startTs)/1000 : 0); }
  function nalogZapoceo(n){ for(var i=0;i<n.ops.length;i++){ var s=n.ops[i].status; if(s==="radu"||s==="gotovo"||s==="dijelovi"||s==="pauza") return true; } return false; }
  function cekaSek(n){ return (Date.now()-n.usaoTs)/1000; }
  function napredak(n){ var tot=n.ops.length, done=n.ops.filter(function(o){return o.status==="gotovo";}).length; return {tot:tot,done:done,pct:tot?Math.round(done/tot*100):0}; }
  function cekanjeTxt(sek){ sek=Math.max(0,Math.floor(sek)); if(sek>=86400){ var d=Math.floor(sek/86400), h=Math.floor((sek%86400)/3600); return d+(d===1?" dan ":" dana ")+h+" h"; } return trajanje(sek); }
  function vrijemeHM(ts){ var d=new Date(ts); var p=function(x){return(x<10?"0":"")+x;}; return p(d.getHours())+":"+p(d.getMinutes()); }
  function nalogZavrsen(n){ return n.ops.length>0 && n.ops.every(function(o){return o.status==="gotovo";}); }
  function brHitnih(){ return nalozi.filter(function(n){return n.hitno && !n.cekaDijelove;}).length; }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  var CH = {plan:"c-plan",ceka:"c-ceka",radu:"c-radu",gotovo:"c-gotovo",dijelovi:"c-ceka",pauza:"c-ceka"};
  var LBL = {plan:"Planirano",ceka:"Čeka potvrdu",radu:"U tijeku",gotovo:"Gotovo",dijelovi:"⛔ Čeka dio",pauza:"⏸ Nije gotovo"};

  // --- akcije (zovu API pa osvježe) ---
  function find(opId){ var all=svabOps(); for(var i=0;i<all.length;i++) if(all[i].o.id===opId) return all[i].o; return null; }
  function nalById(id){ for(var i=0;i<nalozi.length;i++) if(nalozi[i].id===id) return nalozi[i]; return null; }
  function posalji(opId){ act("/zadatak/"+opId+"/posalji"); }
  function isplaniraj(nid){ act("/nalog/"+nid+"/isplaniraj"); }
  function potvrdi(opId){ act("/zadatak/"+opId+"/potvrdi"); }
  function dodijeli(opId,mehId){ act("/zadatak/"+opId+"/dodijeli", {radnici_ids: mehId?[parseInt(mehId,10)]:[]}); }
  function makniRadnika(opId){ act("/zadatak/"+opId+"/makni-radnika"); }
  function dioStigao(opId){ act("/zadatak/"+opId+"/dio-stigao"); }
  function hitno(nid){ var n=nalById(nid); if(!n||n.cekaDijelove) return;
    if(!n.hitno && brHitnih()>=MAX_HITNO){ toast("⚠️ Najviše "+MAX_HITNO+" hitna vozila — prvo makni jedno"); return; }
    api("/nalog/"+nid+"/hitno","PATCH",{hitno:!n.hitno}).then(ucitaj).catch(function(e){ toast(e.message||"Greška"); }); }
  function pomakni(nid,dir){
    var akt=nalozi.filter(function(n){return !n.cekaDijelove && !n.hitno;}).slice().sort(function(a,b){return a.rang-b.rang;});
    var idx=-1; for(var i=0;i<akt.length;i++) if(akt[i].id===nid) idx=i;
    var j=idx+dir; if(idx<0||j<0||j>=akt.length) return;
    var tmp=akt[idx]; akt[idx]=akt[j]; akt[j]=tmp;
    api("/redoslijed","PUT",{redoslijed: akt.map(function(n){return n.id;})}).then(ucitaj).catch(function(e){ toast(e.message||"Greška"); });
  }

  // --- render: Poslovođa ---
  function nalogCard(n, rankTxt, idxObj, lane){
    var mehOpts=function(sel){ var s='<option value="">— dodijeli —</option>'; MEH.forEach(function(m){ s+='<option value="'+m.id+'"'+(sel===m.id?' selected':'')+'>'+esc(m.ime)+'</option>'; }); return s; };
    var h='<div class="card nalog'+(lane==="hit"?' lane-hitno':'')+'"><div class="rang">'+rankTxt+'</div><div class="nbody">';
    h+='<div class="nhead gb-head" onclick="PLAN.kartKlik(event,'+n.id+')" title="Otvori cijeli nalog"><span class="gb">GB '+esc(n.gb)+'</span> <span class="vozilo">'+esc(n.vozilo)+' · '+esc(n.reg)+'</span>'+(nalogZapoceo(n)?'':' <span class="chip waitc" data-wait="'+n.id+'">⏳ u redu '+cekanjeTxt(cekaSek(n))+'</span>');
    h+='<span class="arrows">';
    if(!planZakljucan) h+='<button class="htog'+(n.hitno?' on':'')+'" onclick="PLAN.hitno('+n.id+')" title="Označi/makni HITNO">🔴</button>';
    else if(n.hitno) h+='<span class="htog on" title="Hitno (plan zaključan)">🔴</span>';
    // ručne ↑/↓ uklonjene — plan se automatski poreda po dovršenosti
    h+='</span></div>';
    var _np=napredak(n);
    h+='<div class="prog" title="'+_np.done+'/'+_np.tot+' operacija gotovo"><div class="prog-bar" style="width:'+_np.pct+'%"></div></div>'+
       '<div class="prog-lbl">'+_np.pct+'% završeno · '+_np.done+'/'+_np.tot+' operacija</div>';
    // „Nalog isplaniran" — gumb gore na kartici. Aktivan tek kad su SVE operacije
    // (koje treba poslati) dodijeljene; pošalje svakom mehaničaru prvi zadatak, ostale u red.
    var saljive=n.ops.filter(function(o){return o.status==="plan"||o.status==="pauza";});
    if(saljive.length){
      var sviDod=saljive.every(function(o){return !!o.mehId;});
      h+='<div style="margin:8px 0 2px"><button class="btn sm" onclick="PLAN.isplaniraj('+n.id+')" '+(sviDod?'':'disabled')+
         ' title="'+(sviDod?'Pošalji plan mehaničarima (prvi zadatak odmah, ostali u red)':'Prvo dodijeli radnika na sve operacije')+'">📨 Nalog isplaniran — pošalji ('+saljive.length+')</button></div>';
    }
    n.ops.forEach(function(o){
      if(o.status==="gotovo") return; // gotove operacije se ne prikazuju u planu
      h+='<div class="op"><span class="opn">'+esc(o.naziv)+' <span class="opk">· '+esc(o.kat)+'</span></span>'+
         (((o.akumSek||0)>0 && o.radioIme && (o.status==="plan"||o.status==="pauza"))
            ? ((o.radioId && o.radioId!==o.mehId)
               ? '<button class="opmeh opmeh-btn" onclick="PLAN.dodijeli('+o.id+','+o.radioId+')" title="Dodijeli ponovo — radio je na ovoj operaciji">👷 '+esc(o.radioIme)+'</button>'
               : '<span class="opmeh">👷 '+esc(o.radioIme)+'</span>')
            : '')+
         '<span class="chip '+CH[o.status]+'">'+LBL[o.status]+'</span><span class="right">';
      if(o.status==="plan" || o.status==="pauza"){
        h+='<select onchange="PLAN.dodijeli('+o.id+',this.value)">'+mehOpts(o.mehId)+'</select>';
        var prep=o.preporukaId;
        if(prep && prep!==o.mehId && meh(prep).ime){
          h+='<button class="btn ghost sm zvj" onclick="PLAN.dodijeli('+o.id+','+prep+')" title="Prijedlog po iskustvu — najviše završenih u ovoj kategoriji">⭐ '+esc(meh(prep).ime)+'</button>';
        }
        // (slanje po operaciji maknuto — ide skupno preko „Nalog isplaniran" gumba gore)
      } else {
        h+='<span class="vozilo">👷 '+esc(meh(o.mehId).ime)+'</span>';
        if(o.status==="radu") h+=' <span class="live tnum" data-start="'+o.id+'">⏱ '+trajanje(zivoSek(o))+'</span>';
        if(o.status==="gotovo") h+=' <span class="vozilo tnum">⏱ '+trajanje(o.akumSek)+'</span>';
        if(o.status==="ceka"||o.status==="radu"||o.status==="pauza") h+=' <button class="xrem" onclick="PLAN.makniRadnika('+o.id+')" title="Makni radnika s operacije">✕</button>';
        if(o.status==="dijelovi") h+=' <button class="btn ghost sm" onclick="PLAN.dioStigao('+o.id+')">📦 Dio stigao</button>';
      }
      h+='</span></div>';
    });
    h+='</div></div>';
    return h;
  }
  function renderPL(){

    var _cmp=function(a,b){

      if(ar!==br) return ar?1:-1;                 // u planu (ručni redoslijed) ide prvo
      if(!ar) return a.rang-b.rang;               // po utipkanom redoslijedu
      return napredak(b).pct - napredak(a).pct;   // ostali po dovršenosti
    };
    var hitni=aktSvi.filter(function(n){return n.hitno;}).sort(_cmp);

         (planZakljucan?'':'<button class="btn sm" onclick="PLAN.planMode(true)">➕ Napravi plan</button>')+

         '<button class="brojac-btn" onclick="PLAN.toggleLog()">Promjena plana danas: '+promjene+' '+(logOtvoren?'▴':'▾')+'</button>'+

    if(logOtvoren){

      else h+='<div class="vozilo" style="padding:4px 0">Još nema promjena plana danas.</div>';
      h+='</div>';

    h+='<div class="sek-nas hitno-head">🔴 Hitno — preskače red</div>';
    if(hitni.length){ hitni.forEach(function(n){ h+=nalogCard(n,"🔴",null,"hit"); }); }
    else{ h+='<div class="card" style="color:var(--muted)">Nema hitnih. Označi kamion s 🔴 kad je stvarno hitno.</div>'; }
    h+='<div class="sek-nas">Plan za danas</div>';
    if(norm.length){ norm.forEach(function(n,i){ h+=nalogCard(n,(i+1),{first:i===0,last:i===norm.length-1},"norm"); }); }
    else{ h+='<div class="card" style="color:var(--muted)">Plan je prazan. Klikni <b>➕ Napravi plan</b> i upiši garažne brojeve redom.</div>'; }
    if(ceka.length){
      h+='<div class="sek-nas">⛔ Čeka dijelove — ne troši mjesto u planu</div>';
      ceka.forEach(function(n){
        h+='<div class="card nalog dim"><div class="rang">—</div><div class="nbody">'+
           '<div class="nhead gb-head" onclick="PLAN.kartKlik(event,'+n.id+')" title="Otvori cijeli nalog"><span class="gb">GB '+esc(n.gb)+'</span> <span class="vozilo">'+esc(n.vozilo)+'</span> <span class="chip c-ceka" style="margin-left:auto">⛔ Čeka dijelove</span></div>';
        n.ops.forEach(function(o){ h+='<div class="op"><span class="opn">'+esc(o.naziv)+'</span></div>'; });

  // --- render: Dashboard ---
  // Dashboard broji NALOGE (vozila), ne operacije. Svaki nalog ide u točno
  // jedan stupac prema svom ukupnom stanju.
  function nalogStanje(n){
    if(nalogZavrsen(n)) return "gotovo";                                   // sve operacije gotove
    if(n.cekaDijelove) return "dijelovi";                                  // blokiran — čeka dio
    var ops=n.ops;
    if(ops.some(function(o){return o.status==="radu";})) return "radu";    // netko trenutno radi
    if(ops.some(function(o){return o.status==="ceka";})) return "ceka";    // čeka potvrdu vlasnika
    if(ops.some(function(o){return o.status==="pauza";})) return "pauza";  // stoji (nije gotovo)
    if(nalogZapoceo(n)) return "pauza";                                    // započeo pa stoji
    return "plan";                                                         // još nije počeo
  }
  // „Radnici" — mehaničari u redcima, njihovi zadaci po redu čekanja u stupcima.
  function _faza(s){ return s==="radu"?0 : (s==="ceka"?1:2); }   // isti red kao dispečer
  function redPoRadniku(){
    var map={};
    nalozi.forEach(function(n){
      n.ops.forEach(function(o){
        if(o.status==="gotovo" || o.status==="dijelovi") return;   // gotovo i "čeka dio" nisu u redu
        if(!o.mehId) return;
        (map[o.mehId]=map[o.mehId]||[]).push({n:n,o:o});
      });
    });
    Object.keys(map).forEach(function(id){
      map[id].sort(function(a,b){
        var fa=_faza(a.o.status), fb=_faza(b.o.status); if(fa!==fb) return fa-fb;
        var ra=(a.n.rang==null?9999:a.n.rang), rb=(b.n.rang==null?9999:b.n.rang); if(ra!==rb) return ra-rb;
        return a.o.id-b.o.id;
      });
    });
    return map;
  }
  function renderDASH(){
    var PRAG=2;
    var map=redPoRadniku();
    var saZad=[], slobodni=[];
    MEH.forEach(function(m){ var l=map[m.id]||[]; if(l.length) saZad.push({m:m,lista:l}); else slobodni.push(m); });
    saZad.sort(function(a,b){ return a.m.ime<b.m.ime?-1:(a.m.ime>b.m.ime?1:0); });
    var ukupno=0, trebaDopunu=0;
    saZad.forEach(function(r){
      ukupno+=r.lista.length;
      r.cekaju=r.lista.filter(function(x){return x.o.status==="plan"||x.o.status==="pauza";}).length;
      if(r.cekaju<PRAG) trebaDopunu++;
    });
    var h='';
    h+='<div class="kpis">'+
       '<div class="kpi"><div class="n">'+saZad.length+'</div><div class="l">Radnika sa zadacima</div></div>'+
       '<div class="kpi"><div class="n">'+ukupno+'</div><div class="l">Zadataka u redu</div></div>'+
       '<div class="kpi"><div class="n"'+(trebaDopunu>0?' style="color:var(--s-ceka)"':'')+'>'+trebaDopunu+'</div><div class="l">Za dopunu (&lt;'+PRAG+')</div></div>'+
       '<div class="kpi"><div class="n">'+slobodni.length+'</div><div class="l">Slobodnih</div></div>'+
       '</div>';
    h+='<p class="hint">Mehaničari u redcima, zadaci po redu čekanja (prvi stupac = trenutni). ⚠ = manje od '+PRAG+' u pripremi.</p>';
    if(!saZad.length){
      h+='<div class="card" style="color:var(--muted)">Nijedan mehaničar nema dodijeljene zadatke. Dodijeli ih u pogledu Poslovođa.</div>';
    } else {
      h+='<div class="rad-scroll"><div class="rad-tbl">';
      saZad.forEach(function(r){
        var malo=r.cekaju<PRAG;
        h+='<div class="rad-row"><div class="rad-ime'+(malo?' malo':'')+'">'+(malo?'⚠ ':'')+esc(r.m.ime)+'<span class="rad-br">'+r.lista.length+'</span></div><div class="rad-cells">';
        r.lista.forEach(function(x,i){
          h+='<div class="rad-cell '+CH[x.o.status]+'" onclick="PLAN.kartKlik(event,'+x.n.id+')" title="'+esc(x.o.naziv)+'">'+
             '<span class="rc-poz">'+(i+1)+'</span>'+
             '<span class="rc-gb">'+(x.n.hitno?'🔴 ':'')+'GB '+esc(x.n.gb)+'</span>'+
             '<span class="rc-op">'+esc(x.o.naziv)+'</span>'+
             '<span class="chip '+CH[x.o.status]+'">'+LBL[x.o.status]+'</span></div>';
        });
        h+='</div></div>';
      });
      h+='</div></div>';
    }
    if(slobodni.length){
      h+='<div class="sek-nas">Slobodni (bez zadataka)</div>'+
         '<div class="card" style="color:var(--muted)">'+slobodni.map(function(m){return esc(m.ime);}).join(" · ")+'</div>';
    }
    return h;
  }

  // --- toast ---
  var toEl;
  function toast(msg){
    if(!toEl){ toEl=document.createElement("div"); toEl.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:#111826;color:#fff;padding:9px 16px;border-radius:999px;font-weight:700;font-size:13px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.3);transition:opacity .2s;opacity:0"; document.body.appendChild(toEl); }
    toEl.textContent=msg; toEl.style.opacity="1"; clearTimeout(toEl._t); toEl._t=setTimeout(function(){toEl.style.opacity="0";},1800);
  }

  // --- API za inline onclick ---
  window.PLAN={ posalji:posalji, isplaniraj:isplaniraj, potvrdi:potvrdi, dodijeli:dodijeli, pomakni:pomakni, zakljucaj:zakljucaj, hitno:hitno, makniRadnika:makniRadnika, openStop:openStop, closeStop:closeStop, chooseStop:chooseStop, dioStigao:dioStigao, toggleLog:toggleLog, planMode:planMode, gbKey:gbKey, dodajGB:dodajGB, ocistiPlan:ocistiPlan, otvoriNalog:otvoriNalog, kartKlik:kartKlik,
    setMeh:function(v){ prikazMeh=parseInt(v,10); render(); } };

  // tabs
  document.getElementById("tabs").addEventListener("click",function(e){
    var b=e.target.closest(".tab"); if(!b) return;
    pogled=b.getAttribute("data-v");
    document.querySelectorAll(".tab").forEach(function(t){t.classList.toggle("akt",t===b);});
    render();
  });

  // datum
  var d=new Date();
  var dani=["ned","pon","uto","sri","čet","pet","sub"]; var mj=d.getMonth()+1;
  document.getElementById("datum").textContent = dani[d.getDay()]+" "+d.getDate()+"."+mj+"."+d.getFullYear()+".";

  // Ne osvježavaj (ne iscrtavaj ponovo) dok korisnik bira radnika — inače se
  // padajući izbornik zatvori i klik na predloženog/radnika „propadne".
  var _zadnjaInterakcija = 0;
  document.addEventListener("pointerdown", function(){ _zadnjaInterakcija = Date.now(); }, true);
  function korisnikBira(){
    var a = document.activeElement;
    if(a && (a.tagName==="SELECT" || a.tagName==="INPUT" || a.tagName==="OPTION")) return true;
    return (Date.now() - _zadnjaInterakcija) < 4000;
  }

  render();
  ucitaj();                        // početni dohvat stvarnih podataka
  setInterval(tick,1000);          // živi mjerači
  setInterval(function(){ if(!_busy && !_planMode && !korisnikBira()) ucitaj(); }, 8000);  // osvježi iz baze (ne dok slažeš plan / biraš radnika)
})();
</script>

</body>
