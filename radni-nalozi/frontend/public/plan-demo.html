<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plan radione</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
  /* Layout: traka na vrhu + jedan od tri pogleda (Poslovođa / Mehaničar / Dashboard).
     Stanje je zajedničko — akcija u jednom pogledu odmah se vidi u drugom. */
  :root{
    color-scheme:light;   /* uvijek svijetlo — da se slaže s ostatkom appa */
    --bg:#eef1f6; --card:#ffffff; --fg:#111826; --muted:#5b6678; --line:#dde3ec;
    --plava:#1e51c7; --plava-soft:#e7edfb;
    --crveno:#c0271f; --crveno-bg:#fdecea;
    --s-plan:#64748b; --s-plan-bg:#eef1f5;
    --s-ceka:#b45309; --s-ceka-bg:#fdf1dd;
    --s-radu:#15803d; --s-radu-bg:#e4f5e8;
    --s-gotovo:#0369a1; --s-gotovo-bg:#e2f1fb;
    --font:"Manrope",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.4;
    display:flex;flex-direction:column;overflow:hidden}
  h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em}
  button{font-family:inherit;cursor:pointer}
  .tnum{font-variant-numeric:tabular-nums}

  /* --- Gornja traka --- */
  header{background:var(--plava);color:#fff;flex:none;
    padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .brand{font-weight:800;font-size:16px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
  .brand .proto{font-size:10px;font-weight:700;background:rgba(255,255,255,.22);padding:2px 7px;border-radius:20px;letter-spacing:.06em}
  .datum{font-size:12px;opacity:.9;margin-left:auto;color:#fff}
  .tabs{display:flex;align-items:center;gap:6px;background:var(--plava);flex:none;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 11px;flex-wrap:wrap}
  .tab{border:0;background:rgba(255,255,255,.16);color:#fff;padding:8px 14px;border-radius:999px;font-weight:700;font-size:13px}
  .tab.akt{background:#fff;color:var(--plava)}

  main{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px;padding-block:16px}
  .wrap{max-width:1040px;margin:0 auto}
  /* Fiksni bočni popis vozila u planu (desno) — brzi skok do naloga. Skriven na užem ekranu. */
  .plan-idx{position:fixed;top:104px;right:12px;width:62px;max-height:calc(100vh - 104px - 170px);overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 5px;box-shadow:0 6px 20px rgba(0,0,0,.14);z-index:40;display:none;flex-direction:column;gap:3px}
  .plan-idx-h{font-size:10px;font-weight:800;color:var(--muted);text-align:center;margin-bottom:1px}
  .plan-idx-it{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:5px 2px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;text-align:center}
  .plan-idx-it:hover{border-color:var(--plava);color:var(--plava)}
  .plan-idx-it.hit{border-color:#e5534b;color:#b3261e}
  .card.flash{outline:2px solid var(--plava);outline-offset:2px}
  /* Popis se vidi u plan pogledu na SVIM širinama; desno mu je rezerviran prostor. */
  /* Radnici: puna širina (bez .wrap max-width) — redovi stanu pa nema vodoravne trake bez potrebe */
  body.view-dash .wrap{max-width:none}
  body.view-pl .plan-idx{display:flex}
  body.view-pl main{padding-right:84px}
  /* Fiksni popis mehaničara (lijevo) — broj zadataka u redu, najmanje → najviše;
     crveno = nije prijavljen ni na jedan zadatak (ništa „U tijeku"). Samo na širokom ekranu. */
  .meh-idx{position:fixed;top:104px;left:12px;width:190px;max-height:calc(100vh - 104px - 24px);overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 7px;box-shadow:0 6px 20px rgba(0,0,0,.14);z-index:40;display:none;flex-direction:column;gap:4px}
  .meh-idx-h{font-size:10px;font-weight:800;color:var(--muted);text-align:center;margin-bottom:2px}
  .meh-idx-it{display:flex;flex-direction:column;align-items:stretch;gap:4px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12px;font-weight:700}
  .meh-idx-it .mi-top{display:flex;align-items:center;gap:6px}
  .meh-idx-it .mi-ime{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;background:none;border:0;padding:0;font:inherit;color:inherit;font-weight:700;cursor:pointer}
  .meh-idx-it .mi-caret{color:#9aa3ad;font-weight:400}
  .meh-idx-it .mi-menu{display:none;flex-direction:column;gap:3px;margin-top:2px}
  .meh-idx-it .mi-menu.open{display:flex}
  .meh-idx-it .mi-opt{text-align:left;background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:11px;font-weight:700;cursor:pointer}
  .meh-idx-it .mi-opt.sel{background:var(--plava-soft);border-color:var(--plava);color:var(--plava)}
  .meh-idx-it .mi-br{flex:none;background:var(--plava-soft);color:var(--plava);border-radius:999px;padding:0 8px;font-size:11px;font-weight:800}
  .meh-idx-it.nije{border-color:var(--crveno);color:var(--crveno);background:var(--crveno-bg)}
  .meh-idx-it.nije .mi-br{background:#fff;color:var(--crveno)}
  .meh-idx-it.ods{opacity:.7;background:#f3f4f6}
  .meh-idx-it.te{background:#e8f5e9;border-color:#a5d6a7}
  .bonus-tab{width:100%;border-collapse:collapse;font-size:13px}
  .bonus-tab th,.bonus-tab td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  .bonus-tab th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
  .bonus-tab tr.b-cist td{background:#f0fdf4}
  .b-prek{cursor:pointer;user-select:none;border-bottom:1px dashed currentColor}
  .bonus-tab tr.b-det td{background:#fef2f2;white-space:normal}
  .b-det-ul{margin:4px 0;padding-left:18px;color:var(--tekst);font-weight:400}
  .b-det-ul li{margin:2px 0;font-size:12.5px}
  .kb-dan{margin-bottom:10px}
  .kb-datum{font-weight:700;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:3px}
  .kb-red{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0;border-bottom:1px solid var(--line)}
  @media(min-width:1100px){
    body.view-pl .meh-idx{display:flex}
    body.view-pl main{padding-left:216px}
  }
  @media(max-width:759px){                       /* mobitel — kompaktno, uži popis */
    body.view-pl main{padding-right:46px}
    .plan-idx{width:38px;right:4px;top:92px;padding:5px 3px;gap:2px;max-height:calc(100vh - 92px - 170px)}
    .plan-idx-it{font-size:11px;padding:4px 1px}
    .plan-idx-h{display:none}
  }
  .hint{color:var(--muted);font-size:12.5px;margin:0 0 12px}

  /* --- Kartice / zajedničko --- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .sek-nas{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:18px 2px 8px}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
  .c-plan{color:var(--s-plan);background:var(--s-plan-bg)}
  .c-ceka{color:var(--s-ceka);background:var(--s-ceka-bg)}
  .c-radu{color:var(--s-radu);background:var(--s-radu-bg)}
  .c-gotovo{color:var(--s-gotovo);background:var(--s-gotovo-bg)}
  .btn{border:0;border-radius:10px;padding:8px 12px;font-weight:700;font-size:13px;background:var(--plava);color:#fff}
  .btn.ghost{background:var(--plava-soft);color:var(--plava)}
  .btn.sm{padding:6px 10px;font-size:12px}
  .btn.zvj{background:#fff7ed;color:#b45309;border:1px solid #fed7aa}
  .btn:disabled{opacity:.45;cursor:default}
  select{font-family:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:9px;padding:6px 8px;background:var(--card);color:var(--fg)}
  .gb{font-weight:800;font-size:15px}
  /* Samo zaglavlje (GB linija) vodi na nalog; operacije ostaju za rad. */
  .nhead.gb-head{cursor:pointer}
  .dcard{cursor:pointer}
  .vozilo{color:var(--muted);font-weight:600;font-size:12.5px}

  /* --- Poslovođa --- */
  .pl-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .zak-traka{background:#fef3c7;border:1px solid #fde68a;color:#92400e;border-radius:10px;padding:8px 12px;margin:0 0 10px;font-size:12.5px;font-weight:700}
  .nap-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  .nap-card{padding:12px 14px}
  .nap-head{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;color:var(--s-radu,#1f7a39);padding-bottom:6px;border-bottom:2px solid var(--line)}
  .nap-br{margin-left:auto;background:var(--s-radu,#1f7a39);color:#fff;border-radius:999px;min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;padding:0 6px}
  .nap-task{padding:7px 0;border-top:1px dashed var(--line)}
  .nap-task:first-of-type{border-top:0}
  .nap-t1{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
  .nap-gb{font-weight:800;font-size:12.5px}
  .nap-kat{color:var(--muted);font-size:11px;font-weight:700}
  .nap-vr{margin-left:auto;color:var(--muted);font-size:11px;font-weight:700}
  .nap-opis{font-size:12px;line-height:1.35;margin-top:2px}
  .nap-vrati{margin-top:5px;border:1px solid var(--line);background:var(--card);color:var(--s-ceka);border-radius:999px;padding:2px 10px;font:inherit;font-size:11px;font-weight:700;cursor:pointer}
  .nap-vrati:hover{border-color:var(--s-ceka);background:var(--s-ceka-bg)}
  .pl-top .brojac{margin-left:auto;font-size:12.5px;color:var(--muted);font-weight:700}
  .brojac-btn{margin-left:auto;background:var(--plava-soft);color:var(--plava);border:0;border-radius:999px;padding:6px 12px;font-weight:700;font-size:12.5px;cursor:pointer}
  .plan-maker{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--plava-soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 10px}
  .plan-maker .pm-lbl{font-size:11px;font-weight:700;color:var(--plava)}
  .plan-maker input{flex:1;min-width:110px;max-width:180px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font:inherit;font-size:13px;font-weight:700;background:var(--card);color:var(--fg)}
  .plan-maker .btn{font-size:11px;padding:5px 9px}
  .log-pop{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 8px}
  .log-h{font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
  .log-row{font-size:12.5px;padding:5px 0;border-top:1px dashed var(--line);display:flex;gap:10px}
  .log-t{color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;flex:none}
  .nalog{display:flex;gap:12px;margin-bottom:10px}
  .rang{flex:none;width:30px;height:30px;border-radius:9px;background:var(--plava);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
  .nalog.dim .rang{background:var(--s-plan)}
  .nbody{flex:1;min-width:0}
  .nhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .arrows{margin-left:auto;display:flex;gap:4px}
  .arrows button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;width:28px;height:26px;font-size:13px;line-height:1}
  .arrows .drag-h{cursor:grab;color:var(--muted);touch-action:none;font-size:15px}
  .arrows .drag-h:active{cursor:grabbing}
  .card.nalog.dragging{opacity:.72;box-shadow:0 10px 28px rgba(0,0,0,.20)}
  .op{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:5px 0;border-top:1px dashed var(--line)}
  .op.op-nema{background:var(--crveno-bg);box-shadow:inset 3px 0 0 var(--crveno);padding-left:8px;border-radius:0 6px 6px 0}
  .op .opn{font-weight:600;font-size:12px;line-height:1.3;min-width:150px;flex:1;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .op .opk{color:var(--muted);font-size:10.5px;font-weight:700}
  .op .opmeh{font-size:11px;font-weight:700;color:var(--plava);white-space:nowrap}
  .op .opmeh-btn{border:1px solid var(--line);background:var(--plava-soft);border-radius:999px;padding:3px 9px;cursor:pointer;font-family:inherit}
  .op .opmeh-btn:hover{border-color:var(--plava)}
  .op .meh-cip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--plava);background:var(--plava-soft);border-radius:999px;padding:3px 8px;margin-left:4px}
  .op .cip-x{border:0;background:none;color:var(--plava);cursor:pointer;font-weight:800;font-size:13px;line-height:1;padding:0 1px;font-family:inherit}
  .op .meh-stack{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
  .op .meh-line{display:inline-flex;align-items:center;gap:6px}
  .op .meh-ceka{font-size:11px;font-weight:700;color:#b26a00}
  .op .meh-add-wrap{display:inline-flex;align-items:center;margin-left:4px}
  .op .meh-add{border:1px dashed var(--plava);background:var(--plava-soft);color:var(--plava);border-radius:999px;width:24px;height:24px;cursor:pointer;font-weight:800;font-size:15px;line-height:1;font-family:inherit}
  .op .meh-add:hover{background:#dbe6fb}
  .op .right{margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  /* Uže kontrole da opis operacije dobije više prostora */
  .op .right select{max-width:108px;font-size:11px;padding:5px 6px}
  .op .right .btn{font-size:11px;padding:5px 8px}
  .op .right .zvj{max-width:104px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lane-hitno{border-color:var(--crveno)}
  .lane-hitno .rang{background:var(--crveno)}
  .hitno-head{color:var(--crveno)}
  .slob-card{display:flex;flex-wrap:wrap;gap:6px}
  .slob-cip{display:inline-flex;align-items:center;font-size:12.5px;font-weight:700;color:var(--plava);background:var(--plava-soft);border-radius:999px;padding:4px 10px}
  .htag{color:var(--crveno);background:var(--crveno-bg)}
  .waitc,.waitc2{color:var(--muted);background:var(--s-plan-bg);font-weight:700}
  .xrem{border:1px solid var(--line);background:var(--card);color:var(--crveno);border-radius:7px;width:24px;height:24px;font-size:12px;line-height:1;cursor:pointer}
  .prog{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin:7px 0 3px}
  .prog-bar{height:100%;background:var(--s-radu);border-radius:999px;transition:width .3s}
  .prog-lbl{font-size:11px;color:var(--muted);font-weight:700}
  .arrows button.htog{color:var(--crveno);font-size:12px}
  .arrows button.htog.on{background:var(--crveno);border-color:var(--crveno)}

  /* --- Mehaničar (mobitel) --- */
  .phone-sel{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .phone{max-width:380px;margin:0 auto;border:1px solid var(--line);border-radius:22px;background:var(--card);overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.10)}
  .ph-top{background:var(--plava);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:8px}
  .ph-top .who{font-weight:800}
  .ph-top .mini{font-size:11px;opacity:.9;margin-left:auto}
  .ph-body{padding:12px 14px 18px;display:flex;flex-direction:column;gap:10px;min-height:280px}
  .notif{border:1px solid var(--s-ceka);background:var(--s-ceka-bg);border-radius:12px;padding:10px 12px}
  .notif .nt{font-weight:800;color:var(--s-ceka);font-size:12px;letter-spacing:.03em;display:flex;align-items:center;gap:6px}
  .op-card{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
  .op-card .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .op-card .big{font-size:22px;font-weight:800}
  .op-card.radu{border-color:var(--s-radu)}
  .ph-prazno{color:var(--muted);text-align:center;padding:26px 8px}

  /* --- Dashboard --- */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin-bottom:14px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .kpi .n{font-size:26px;font-weight:800;line-height:1}
  .kpi .l{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-top:4px}
  .kpi .n.radu{color:var(--s-radu)}
  .kol-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .kol{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0}
  .kol h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:8px}
  .kol h3 .dot{width:8px;height:8px;border-radius:50%}
  .dcard{border:1px solid var(--line);border-radius:10px;padding:8px 9px;margin-bottom:8px}
  .dcard .g{font-weight:800;font-size:13px}
  .dcard .o{font-size:12px;margin-top:1px}
  .dcard .m{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .live{font-weight:800;color:var(--s-radu)}

  /* --- Radnici (red po mehaničaru) --- */
  .rad-scroll{overflow-x:auto;padding-bottom:6px}
  .rad-tbl{display:flex;flex-direction:column;gap:8px;min-width:min-content}
  .rad-row{display:flex;align-items:stretch;gap:8px}
  .rad-ime{flex:none;width:168px;position:sticky;left:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-weight:800;font-size:12.5px;display:flex;flex-direction:column;align-items:stretch;gap:5px;z-index:2}
  .rad-ime .ri-top{display:flex;align-items:center;gap:6px}
  .rad-ime.malo{border-color:var(--s-ceka);color:var(--s-ceka);background:var(--s-ceka-bg)}
  .rad-ime.nije{border-color:var(--crveno);color:var(--crveno);background:var(--crveno-bg)}
  .rad-ime.nije .rad-br{background:#fff;color:var(--crveno)}
  .rad-ime.slob-top{border-color:var(--crveno);color:var(--crveno);background:var(--crveno-bg);font-weight:800}
  .rad-ime.slob-top .rad-br{background:#fff;color:var(--crveno)}
  .rad-cell.prazno{justify-content:center;align-items:center;text-align:center;color:var(--crveno);border-style:dashed;border-color:var(--crveno);background:transparent;cursor:default;font-size:11.5px;font-weight:700}
  .rad-ime .ri-ime{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rad-send{align-self:stretch;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:3px 7px;font-size:13px;line-height:1.3;cursor:pointer}
  .rad-send:hover{border-color:var(--plava)}
  .rad-prijavi{align-self:stretch;margin-top:4px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:3px 7px;font-size:13px;line-height:1.3;cursor:pointer}
  .rad-prijavi:hover{border-color:#b26a00;color:#b26a00}
  .rad-br{margin-left:4px;background:var(--plava-soft);color:var(--plava);border-radius:999px;padding:1px 9px;font-size:11px;font-weight:800}
  .rad-ime.malo .rad-br{background:#fff;color:var(--s-ceka)}
  .rad-cells{display:flex;gap:8px}
  .rad-cell{flex:none;width:152px;border:1px solid var(--line);border-radius:10px;padding:18px 9px 8px;background:var(--card);cursor:pointer;display:flex;flex-direction:column;gap:4px;position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .rad-cell.drag-arm{outline:2px solid var(--plava);outline-offset:1px}
  .rad-cell.c-radu{border-color:var(--s-radu)}
  .rad-cell .rc-poz{position:absolute;top:5px;right:8px;font-size:10px;font-weight:800;color:var(--muted)}
  .rad-cell .rc-drag{position:absolute;top:3px;left:5px;border:0;background:none;color:var(--muted);cursor:grab;touch-action:none;font-size:13px;line-height:1;padding:0 2px;font-family:inherit}
  .rad-cell .rc-drag:active{cursor:grabbing}
  .rad-cell.dragging{opacity:.7;box-shadow:0 8px 20px rgba(0,0,0,.18)}
  .rad-cell .rc-gb{font-weight:800;font-size:13px}
  .rad-cell .rc-op{font-size:11px;color:var(--muted);line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  .foot{color:var(--muted);font-size:11.5px;text-align:center;margin:20px 0 4px}
  .modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
  .modal-box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;max-width:360px;width:100%;display:flex;flex-direction:column;gap:9px;box-shadow:0 18px 50px rgba(0,0,0,.4)}
  .modal-t{font-weight:800;font-size:16px}
  .modal-sub{color:var(--muted);font-size:13px;margin-bottom:4px}
  .modal-box .btn{width:100%}
  .btn.ok{background:var(--s-radu);color:#fff}
  .btn.warn{background:var(--s-ceka-bg);color:var(--s-ceka)}
  .btn.danger{background:var(--crveno-bg);color:var(--crveno)}
  .modal-x{background:none;border:0;color:var(--muted);font-weight:700;padding:6px;cursor:pointer}

  @media (max-width:760px){
    .kpis{grid-template-columns:repeat(2,1fr)}
    .kol-grid{grid-template-columns:1fr;gap:12px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  [hidden]{display:none!important}
</style>
</head>
<body>


<nav class="tabs" id="tabs">
  <button class="tab akt" data-v="pl">👷‍♂️ Poslovođa</button>
  <button class="tab" data-v="meh">📱 Mehaničar</button>
  <button class="tab" data-v="dash">👷 Radnici</button>
  <button class="tab" data-v="nap">✅ Napravljeno</button>
  <button class="tab" data-v="bonus">💶 Klik-bonus</button>
  <span class="datum" id="datum"></span>
</nav>

<main>
  <div class="wrap">
    <section id="v-pl" hidden></section>
    <section id="v-meh" hidden></section>
    <section id="v-dash" hidden></section>
    <section id="v-nap" hidden></section>
    <section id="v-bonus" hidden></section>
    <div class="foot">Vidljivo samo vlasniku · osvježava se automatski.</div>
  </div>
</main>

<div class="modal-ov" id="modal" hidden>
  <div class="modal-box">
    <div class="modal-t">Razlog prekida operacije</div>
    <div class="modal-sub" id="modal-sub"></div>
    <button class="btn ok" onclick="PLAN.chooseStop('gotovo')">✅ Gotovo</button>
    <button class="btn warn" onclick="PLAN.chooseStop('nije')">⏸ Nije gotovo</button>
    <button class="btn danger" onclick="PLAN.chooseStop('dijelovi')">⛔ Nema dijelova</button>
    <button class="modal-x" onclick="PLAN.closeStop()">Odustani</button>
  </div>
</div>

<script>
(function(){
  "use strict";
  var MEH = [];           // mehaničari — iz API-ja
  var nalozi = [];        // nalozi/operacije — iz API-ja
  var promjeneLog = [];   // dnevnik promjena plana (churn) — iz API-ja
  var promjene = 0;
  var logOtvoren = false;
  var _planMode = false;
  var planZakljucan = false;   // stvarno stanje sa servera (zaključano za danas)
  var zakljucaoIme = "", zakljucanoTs = null;
  var autoSlanje = {ukljuceno:false, ura:"06:45", datum:null};   // jutarnje auto-slanje plana
  var prikazMeh = null;        // koga gledamo u mobitel-pogledu
  var pogled = "pl";
  var napravljeno = {mehanicari:[], ukupno:0};   // tko je što napravio danas (gotovi zadaci)
  var bonus = null;              // klik-bonus (jutarnja disciplina) — povuče se kad se otvori tab
  var napravOtvoren = false;                      // je li kartica „napravljeno" raširena
  var _brojMeh = {};           // mehId -> broj zadataka u redu (za prikaz u dropdownu)
  var MAX_HITNO = 3;

  function meh(id){ for(var i=0;i<MEH.length;i++) if(MEH[i].id===id) return MEH[i]; return {ime:""}; }

  // --- API (isti origin → token iz app localStorage) ---
  function token(){ try { return localStorage.getItem("token"); } catch(_){ return null; } }
  function api(path, method, body){
    var h={"Content-Type":"application/json"}; var t=token(); if(t) h.Authorization="Bearer "+t;
    return fetch("/api/plan"+path, { method:method||"GET", headers:h, body: body!==undefined?JSON.stringify(body):undefined })
      .then(function(r){ if(!r.ok) return r.json().catch(function(){return {};}).then(function(j){ throw new Error(j.detail||("Greška "+r.status)); }); return r.json().catch(function(){return {};}); });
  }
  // Generički poziv (izvan /api/plan prefiksa) — npr. odsutnost radnika.
  function apiRaw(path, method, body){
    var h={"Content-Type":"application/json"}; var t=token(); if(t) h.Authorization="Bearer "+t;
    return fetch("/api"+path, { method:method||"GET", headers:h, body: body!==undefined?JSON.stringify(body):undefined })
      .then(function(r){ if(!r.ok) return r.json().catch(function(){return {};}).then(function(j){ throw new Error(j.detail||("Greška "+r.status)); }); return r.json().catch(function(){return {};}); });
  }
  // Otvori/zatvori skriveni status-izbornik radnika (klik na ime) — kao chip na tekućim radovima.
  function toggleStat(id){
    var el=document.getElementById('stat-'+id); if(!el) return;
    var bio=el.classList.contains('open');
    Array.prototype.forEach.call(document.querySelectorAll('.mi-menu.open'), function(m){ m.classList.remove('open'); });
    if(!bio) el.classList.add('open');
  }
  // Postavi status radnika (Dostupan/Teren/Godišnji/Bolovanje/Odsutan) iz liste mehaničara.
  function postaviStatus(id, vrsta){
    var el=document.getElementById('stat-'+id); if(el) el.classList.remove('open');
    apiRaw("/korisnici/"+id+"/odsutnost", "PATCH", { vrsta: vrsta||null, od:null, do:null })
      .then(function(){ ucitaj(true); })
      .catch(function(e){ alert(e.message||"Greška kod promjene statusa"); });
  }
  var _busy=false;
  // Potpis strukture plana — ako se ne promijeni, periodično osvježavanje NEĆE
  // precrtavati popis (inače se izbornik/gumb sruši ispod prsta pa klik propadne).
  var _lastSig=null;
  function planSig(d){
    return JSON.stringify({
      z:!!d.zakljucan, p:(d.promjene||[]).length, a:JSON.stringify(d.autoSlanje||{}),
      m:(d.mehanicari||[]).map(function(x){return x.id+'-'+(x.odsutnost||(x.odsutan?'o':''));}),
      n:(d.nalozi||[]).map(function(n){return [n.id,n.rang,n.hitno?1:0,n.cekaDijelove?1:0,
          (n.ops||[]).map(function(o){return [o.id,o.status,(o.mehIds||[]).join('-'),o.radioId];})];})
    });
  }
  function ucitaj(force){
    var odMs=new Date(new Date().setHours(0,0,0,0)).getTime();   // danas 00:00 lokalno
    // „Napravljeno" povuci SAMO kad je taj tab otvoren — inače svaki ciklus (8 s) × puno
    // kartica nepotrebno opterećuje server (dupli upiti) i zna izgladniti prijavu (502).
    var pNap=(pogled==="nap") ? api("/napravljeno?od_ms="+odMs).catch(function(){ return null; }) : Promise.resolve(null);
    return Promise.all([api(""), pNap]).then(function(res){
      var d=res[0]; if(res[1]) napravljeno=res[1];
      MEH=d.mehanicari||[]; nalozi=d.nalozi||[]; promjeneLog=d.promjene||[]; promjene=promjeneLog.length;
      planZakljucan=!!d.zakljucan; zakljucaoIme=d.zakljucaoIme||""; zakljucanoTs=d.zakljucanoTs||null;
      autoSlanje=d.autoSlanje||{ukljuceno:false,ura:"06:45",datum:null};
      if(prikazMeh===null && MEH.length) prikazMeh=MEH[0].id;
      var s=planSig(d)+"|nap:"+(napravljeno.ukupno||0);
      if(!force && s===_lastSig) return;   // ništa strukturno novo → ne precrtavaj
      _lastSig=s; render();
    }).catch(function(e){ toast(e.message||"Greška pri učitavanju"); });
  }
  function act(p, body){ if(_busy) return; _busy=true; return api(p,"POST",body).then(function(){ return ucitaj(true); }).catch(function(e){ toast(e.message||"Greška"); }).then(function(){ _busy=false; }); }

  // --- pomoćno ---
  function svabOps(){ var a=[]; nalozi.forEach(function(n){ n.ops.forEach(function(o){ a.push({n:n,o:o}); }); }); return a; }
  function nalByOp(opId){ for(var i=0;i<nalozi.length;i++){var n=nalozi[i];for(var j=0;j<n.ops.length;j++) if(n.ops[j].id===opId) return n;} return null; }
  function trajanje(sek){ sek=Math.max(0,Math.floor(sek)); var h=Math.floor(sek/3600),m=Math.floor((sek%3600)/60),s=sek%60; var p=function(x){return(x<10?"0":"")+x;}; return h>0? h+":"+p(m)+":"+p(s) : m+":"+p(s); }
  function zivoSek(o){ return o.startTs? (Date.now()-o.startTs)/1000 : 0; }   // samo trenutna sesija (kao „Tekući radovi"), bez nakupljenog od prije
  function zivoSekMeh(mv){ return (mv.akumSek||0) + (mv.startTs? (Date.now()-mv.startTs)/1000 : 0); }   // ukupno vrijeme tog mehaničara (akumulirano + živo ako radi)
  function nalogZapoceo(n){ for(var i=0;i<n.ops.length;i++){ var s=n.ops[i].status; if(s==="radu"||s==="gotovo"||s==="dijelovi"||s==="pauza") return true; } return false; }
  function cekaSek(n){ return (Date.now()-n.usaoTs)/1000; }
  function napredak(n){ var tot=n.ops.length, done=n.ops.filter(function(o){return o.status==="gotovo";}).length; return {tot:tot,done:done,pct:tot?Math.round(done/tot*100):0}; }
  function cekanjeTxt(sek){ sek=Math.max(0,Math.floor(sek)); if(sek>=86400){ var d=Math.floor(sek/86400), h=Math.floor((sek%86400)/3600); return d+(d===1?" dan ":" dana ")+h+" h"; } return trajanje(sek); }
  function vrijemeHM(ts){ var d=new Date(ts); var p=function(x){return(x<10?"0":"")+x;}; return p(d.getHours())+":"+p(d.getMinutes()); }
  function nalogZavrsen(n){ return n.ops.length>0 && n.ops.every(function(o){return o.status==="gotovo";}); }
  function brHitnih(){ return nalozi.filter(function(n){return n.hitno && !n.cekaDijelove;}).length; }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  var CH = {plan:"c-plan",ceka:"c-ceka",radu:"c-radu",gotovo:"c-gotovo",dijelovi:"c-ceka",nedostupan:"c-ceka",pauza:"c-ceka"};
  var LBL = {plan:"Planirano",ceka:"Čeka potvrdu",radu:"U tijeku",gotovo:"Gotovo",dijelovi:"⛔ Čeka dio",nedostupan:"🚫 Vozilo nedostupno",pauza:"⏸ Nije gotovo"};
  // Status operacije ZA KONKRETNOG radnika: „U tijeku" samo ako je NJEGOV mjerač pokrenut.
  // Ako operacija radi, ali on nije pokrenuo svoj dio → „Čeka potvrdu" (mora sam stisnuti).
  function mehStatus(o, rid){
    var mv=(o.mehVremena||[]).find(function(v){return v.id===rid;});
    if(mv && mv.startTs) return "radu";
    if(o.status==="radu") return "ceka";
    return o.status;
  }

  // --- akcije (zovu API pa osvježe) ---
  function find(opId){ var all=svabOps(); for(var i=0;i<all.length;i++) if(all[i].o.id===opId) return all[i].o; return null; }
  function nalById(id){ for(var i=0;i<nalozi.length;i++) if(nalozi[i].id===id) return nalozi[i]; return null; }
  function posalji(opId){ act("/zadatak/"+opId+"/posalji"); }
  function isplaniraj(nid){ act("/nalog/"+nid+"/isplaniraj"); }
  function isplanirajSve(){ if(_busy) return; _busy=true; api("/isplaniraj-sve","POST").then(function(r){ toast("📨 Poslano "+((r&&r.poslano)||0)+(r&&r.vec_poslano?" · "+r.vec_poslano+" već poslano":"")+(r&&r.vec_rade?" · "+r.vec_rade+" već rade":"")+(r&&r.odsutni?" · "+r.odsutni+" odsutno":"")); return ucitaj(true); }).catch(function(e){ toast(e.message||"Greška"); }).then(function(){ _busy=false; }); }
  function autoSlanjeHtml(){
    var pon=(autoSlanje.ponavlja)||{ukljuceno:false,ura:"07:00"};
    // Ponavljajuće: svaki radni dan sam od sebe (glavni način).
    var h='';
    if(pon.ukljuceno){
      h+='<span class="pl-auto on">🔁 Svaki radni dan u '+esc(pon.ura||'07:00')+' <button class="btn ghost sm" onclick="PLAN.autoPonOff()">Ugasi</button></span>';
    } else {
      h+='<span class="pl-auto">🔁 <input id="auto-pon-ura" type="time" value="'+esc(pon.ura||'07:00')+'" style="padding:4px 6px;border:1px solid var(--rub,#ccc);border-radius:6px;font:inherit;width:92px"> <button class="btn ghost sm" onclick="PLAN.autoPonOn()" title="Automatski svaki radni dan (pon–sub) pošalji plan mehaničarima u ovo vrijeme">Svaki radni dan</button></span>';
    }
    // Jednokratno (zakaži za sutra) — ostaje kao rezerva.
    if(autoSlanje.ukljuceno){
      h+=' <span class="pl-auto on">⏰ Jednom: '+esc(autoSlanje.datum||'')+' u '+esc(autoSlanje.ura||'')+' <button class="btn ghost sm" onclick="PLAN.autoOff()">Otkaži</button></span>';
    } else {
      h+=' <span class="pl-auto">⏰ <input id="auto-ura" type="time" value="'+esc(autoSlanje.ura||'06:45')+'" style="padding:4px 6px;border:1px solid var(--rub,#ccc);border-radius:6px;font:inherit;width:92px"> <button class="btn ghost sm" onclick="PLAN.autoOn()" title="Jednokratno — pošalji plan u navedeno vrijeme (samo sljedeći put)">Zakaži jednom</button></span>';
    }
    return h;
  }
  function autoOn(){ var el=document.getElementById("auto-ura"); var ura=(el&&el.value)||"06:45"; act("/auto-slanje",{ukljuceno:true,ura:ura}); }
  function autoOff(){ act("/auto-slanje",{ukljuceno:false}); }
  function autoPonOn(){ var el=document.getElementById("auto-pon-ura"); var ura=(el&&el.value)||"07:00"; act("/auto-slanje-ponavlja",{ukljuceno:true,ura:ura}); }
  function autoPonOff(){ act("/auto-slanje-ponavlja",{ukljuceno:false}); }
  function potvrdi(opId){ act("/zadatak/"+opId+"/potvrdi"); }
  function dodijeli(opId,mehId){ act("/zadatak/"+opId+"/dodijeli", {radnici_ids: mehId?[parseInt(mehId,10)]:[]}); }
  function dodajRadnika(opId,mehId,postojeci){ if(!mehId) return; var ids=(postojeci||[]).slice(); var nid=parseInt(mehId,10); if(ids.indexOf(nid)<0) ids.push(nid); act("/zadatak/"+opId+"/dodijeli", {radnici_ids: ids}); }
  function makniRadnikaIz(opId,mehId,postojeci){ var ids=(postojeci||[]).filter(function(x){return x!==mehId;}); act("/zadatak/"+opId+"/dodijeli", {radnici_ids: ids}); }
  function pokaziDodaj(btn){ try{ btn.style.display='none'; var sel=btn.parentNode.querySelector('.meh-add-sel'); if(sel){ sel.style.display=''; sel.focus(); } }catch(e){} }
  function makniRadnika(opId){ act("/zadatak/"+opId+"/makni-radnika"); }
  function dioStigao(opId){ act("/zadatak/"+opId+"/dio-stigao"); }
  function hitno(nid){ var n=nalById(nid); if(!n||n.cekaDijelove) return;
    if(!n.hitno && brHitnih()>=MAX_HITNO){ toast("⚠️ Najviše "+MAX_HITNO+" hitna vozila — prvo makni jedno"); return; }
    api("/nalog/"+nid+"/hitno","PATCH",{hitno:!n.hitno}).then(ucitaj).catch(function(e){ toast(e.message||"Greška"); }); }
  function pomakni(nid,dir){
    var akt=nalozi.filter(function(n){return !n.cekaDijelove && !n.hitno;}).slice().sort(function(a,b){return a.rang-b.rang;});
    var idx=-1; for(var i=0;i<akt.length;i++) if(akt[i].id===nid) idx=i;
    var j=idx+dir; if(idx<0||j<0||j>=akt.length) return;
    var tmp=akt[idx]; akt[idx]=akt[j]; akt[j]=tmp;
    api("/redoslijed","PUT",{redoslijed: akt.map(function(n){return n.id;})}).then(ucitaj).catch(function(e){ toast(e.message||"Greška"); });
  }
  function zakljucaj(){ var novo=!planZakljucan; if(_busy) return; _busy=true;
    api("/zakljucaj","POST",{zakljucan:novo}).then(function(){ toast(novo?"🔒 Plan zaključan":"Plan otključan"); return ucitaj(); })
      .catch(function(e){ toast(e.message||"Greška"); }).then(function(){ _busy=false; }); }
  function toggleLog(){ logOtvoren=!logOtvoren; render(); }
  function toggleNaprav(){ napravOtvoren=!napravOtvoren; render(); }
  function _fokusGB(){ var e=document.getElementById("gb-unos"); if(e) e.focus(); }
  function planMode(on){
    // NE briše plan — samo otvori unos da se DODA vozilo u postojeći plan.
    // (Brisanje cijelog plana je zaseban gumb „🗑 Očisti plan".)
    _planMode=!!on; render(); if(on) setTimeout(_fokusGB,0);
  }
  function gbKey(ev,el){ if(ev.key==="Enter"){ ev.preventDefault(); dodajGB(el.value); } }
  function dodajGB(gb){ gb=(gb||"").trim(); if(!gb) return;
    api("/dodaj","POST",{gb:gb}).then(function(r){ toast("✅ GB "+(r&&r.gb||gb)+" dodan u plan"); return ucitaj(); })
      .catch(function(e){ toast(e.message||"Greška"); }).then(_fokusGB); }
  function ocistiPlan(){ api("/ocisti","POST").then(function(){ toast("Plan očišćen — kreni novi"); return ucitaj(); }).then(_fokusGB); }
  function izbaci(nid){ if(_busy) return; _busy=true; api("/nalog/"+nid+"/izbaci","POST").then(function(r){ toast("Izbačeno iz plana"+(r&&r.gb?" · GB "+r.gb:"")); return ucitaj(true); }).catch(function(e){ toast(e.message||"Greška"); }).then(function(){ _busy=false; }); }
  // Zatvori nalog i prenesi nedovršeno u novi (radiona „okreni list"): gotovo → povijest.
  function obnovi(nid){ if(_busy) return; var n=nalById(nid); var np=n?napredak(n):{done:0,tot:0};
    if(!confirm("Zatvoriti ovaj nalog i otvoriti novi pod istim GB?\n\n• "+(np.tot-np.done)+" nedovršenih operacija → novi nalog (radnici i mjerači ostaju)\n• "+np.done+" gotovih → servisna povijest")) return;
    _busy=true; api("/nalog/"+nid+"/obnovi","POST").then(function(r){ toast("🗂 Novi nalog "+((r&&r.novi_broj)||"")+" · preneseno "+((r&&r.preneseno)||0)+", arhivirano "+((r&&r.arhivirano)||0)); return ucitaj(true); }).catch(function(e){ toast(e.message||"Greška"); }).then(function(){ _busy=false; }); }
  // Prekid operacije (modal): gotovo / nije gotovo / nema dijelova
  var stopOp=null;
  function openStop(opId){ var o=find(opId); if(!o) return; stopOp=opId; var n=nalByOp(opId); document.getElementById("modal-sub").textContent=(n?"GB "+n.gb+" · ":"")+o.naziv; document.getElementById("modal").hidden=false; }
  function closeStop(){ stopOp=null; document.getElementById("modal").hidden=true; }
  function chooseStop(r){ var id=stopOp; closeStop(); if(id) act("/zadatak/"+id+"/prekini", {razlog:r}); }

  // Klik na karticu naloga → otvori cijeli nalog u aplikaciji (preko roditeljskog okvira).
  function otvoriNalog(id){
    if(window.parent && window.parent!==window){
      try{ window.parent.postMessage({tip:"plan-otvori-nalog", id:id}, location.origin); return; }catch(e){}
    }
    location.href="/nalozi/"+id;
  }
  // Klik na karticu vodi na nalog, ali ne kad se klikne kontrola (dodijeli/pošalji/🔴/✕/📦…).
  function kartKlik(ev, id){
    if(ev.target.closest("button,select,input,option,a,label")) return;
    otvoriNalog(id);
  }

  // Broj zadataka u redu po mehaničaru (nezavršeni, ne "čeka dio") — za prikaz uz ime.
  function brojUReduPoMeh(){
    var c={};
    nalozi.forEach(function(n){ n.ops.forEach(function(o){
      if(o.status!=="gotovo" && o.status!=="dijelovi" && o.status!=="nedostupan") (o.mehIds||[]).forEach(function(id){ c[id]=(c[id]||0)+1; });
    }); });
    return c;
  }

  // --- render: Poslovođa ---
  function nalogCard(n, rankTxt, idxObj, lane){
    var mehOpts=function(sel){ var s='<option value="">— dodijeli —</option>'; MEH.forEach(function(m){ var bz=_brojMeh[m.id]||0; s+='<option value="'+m.id+'"'+(sel===m.id?' selected':'')+'>'+esc(m.ime)+' ('+bz+')</option>'; }); return s; };

    if(!planZakljucan) h+='<button class="htog'+(n.hitno?' on':'')+'" onclick="PLAN.hitno('+n.id+')" title="Označi/makni HITNO">🔴</button>';
    else if(n.hitno) h+='<span class="htog on" title="Hitno (plan zaključan)">🔴</span>';
    if(!planZakljucan) h+='<button class="xrem" onclick="PLAN.izbaci('+n.id+')" title="Izbaci iz plana">✕</button>';
    h+='</span></div>';
    var _np=napredak(n);
    h+='<div class="prog" title="'+_np.done+'/'+_np.tot+' operacija gotovo"><div class="prog-bar" style="width:'+_np.pct+'%"></div></div>'+
       '<div class="prog-lbl">'+_np.pct+'% završeno · '+_np.done+'/'+_np.tot+' operacija</div>';
    // „Okreni list" SAMO za radionu GB 400 (sabirni nalog): zatvori nalog — gotovo u
    // povijest, nedovršeno u novi nalog pod istim GB. Na običnim nalozima se ne nudi.
    // Prikaži samo kad ima i gotovih i nedovršenih operacija i plan nije zaključan.
    if(!planZakljucan && (String(n.gb||"").replace(/^0+/,"")==="400") && _np.done>0 && _np.done<_np.tot){
      h+='<div style="margin:6px 0 2px"><button class="btn ghost sm" onclick="PLAN.obnovi('+n.id+')" title="Zatvori nalog: gotove operacije idu u povijest, a nedovršene u novi nalog pod istim GB (radnici i mjerači ostaju)">🗂 Arhiviraj gotovo → novi nalog ('+_np.done+')</button></div>';
    }
    // (Gumb „Nalog isplaniran" po nalogu uklonjen — dodjela radnika ga već stavlja u red;
    // slanje ide skupno preko „Pošalji sve naloge" gore i jutarnjeg auto-slanja.)
    n.ops.forEach(function(o){
      if(o.status==="gotovo") return; // gotove operacije se ne prikazuju u planu
      // Operacija koju još treba dodijeliti, a nema nijednog radnika → blago zacrveni redak.
      var nemaRadnika = (o.status==="plan"||o.status==="pauza") && !(o.mehovi && o.mehovi.length);
      h+='<div class="op'+(nemaRadnika?' op-nema':'')+'"><span class="opn">'+esc(o.naziv)+' <span class="opk">· '+esc(o.kat)+'</span></span>'+
         (((o.akumSek||0)>0 && o.radioIme && (o.status==="plan"||o.status==="pauza"))
            ? ((o.radioId && o.radioId!==o.mehId)
               ? '<button class="opmeh opmeh-btn" onclick="PLAN.dodijeli('+o.id+','+o.radioId+')" title="Dodijeli ponovo — radio je na ovoj operaciji">👷 '+esc(o.radioIme)+'</button>'
               : '<span class="opmeh">👷 '+esc(o.radioIme)+'</span>')
            : '')+
         '<span class="chip '+CH[o.status]+'">'+LBL[o.status]+'</span><span class="right">';
      if(o.status==="plan" || o.status==="pauza"){
        var dod=o.mehovi||[]; var idsStr='['+(o.mehIds||[]).join(',')+']';
        if(dod.length===0){
          // još nitko nije dodijeljen → glavni padajući izbornik + prijedlog
          h+='<select onchange="PLAN.dodijeli('+o.id+',this.value)">'+mehOpts(0)+'</select>';
          var prep=o.preporukaId;
          var prepIme=o.preporukaIme || (meh(prep)&&meh(prep).ime);   // pregledar nije u MEH → ime iz payloada
          if(prep && prepIme){
            var prepBroj = o.preporukaIme ? '' : ' ('+(_brojMeh[prep]||0)+')';   // prijedlog po ulozi → bez brojača
            h+='<button class="btn ghost sm zvj" onclick="PLAN.dodijeli('+o.id+','+prep+')" title="Prijedlog mehaničara za ovu operaciju">⭐ '+esc(prepIme)+prepBroj+'</button>';
          }
        } else {
          // dodijeljeni → čipovi (sa ✕) + „＋" ikonica za još jednog mehaničara
          dod.forEach(function(r){
            h+='<span class="meh-cip">👷 '+esc(r.ime)+' <button class="cip-x" onclick="PLAN.makniRadnikaIz('+o.id+','+r.id+','+idsStr+')" title="Makni s operacije">✕</button></span>';
          });
          h+='<span class="meh-add-wrap">'
            +'<button class="meh-add" title="Dodaj još jednog mehaničara" onclick="PLAN.pokaziDodaj(this)">＋</button>'
            +'<select class="meh-add-sel" style="display:none" onchange="PLAN.dodajRadnika('+o.id+',this.value,'+idsStr+')">'+mehOptsExcept(o.mehIds)+'</select>'
            +'</span>';
        }
        // (slanje po operaciji maknuto — ide skupno preko „Nalog isplaniran" gumba gore)
      } else {
        // Svi dodijeljeni na operaciji (ne samo prvi) — za operacije s 2+ mehaničara.
        var dod2=(o.mehovi&&o.mehovi.length)?o.mehovi:(o.mehId?[{id:o.mehId,ime:meh(o.mehId).ime}]:[]);
        if(dod2.length<=1){
          h+='<span class="vozilo">👷 '+esc((dod2[0]&&dod2[0].ime)||meh(o.mehId).ime)+'</span>';
          if(o.status==="radu") h+=' <span class="live tnum" data-start="'+o.id+'">⏱ '+trajanje(zivoSek(o))+'</span>';
          if(o.status==="ceka"||o.status==="radu") h+=' <button class="xrem" onclick="PLAN.makniRadnika('+o.id+')" title="Makni radnika s operacije">✕</button>';
        } else {
          var idsStr2='['+(o.mehIds||[]).join(',')+']';
          var mv=(o.mehVremena&&o.mehVremena.length)?o.mehVremena:dod2.map(function(r){return {id:r.id,ime:r.ime,akumSek:0,startTs:null};});
          h+='<span class="meh-stack">';
          mv.forEach(function(r){
            // Mjerač se prikaže SAMO ako je OVAJ radnik pokrenuo svoj dio (ili ima nakupljeno),
            // a ne samo zato što operacija radi — inače je ispadalo da radi i tko nije kliknuo.
            var tHtml='';
            if(r.startTs || (r.akumSek||0)>0){
              tHtml=' <span class="live tnum" data-ts="'+(r.startTs||'')+'" data-base="'+(r.akumSek||0)+'">⏱ '+trajanje(zivoSekMeh(r))+'</span>';
            } else if(o.status==="radu"){
              tHtml=' <span class="meh-ceka">čeka svoj start</span>';
            }
            h+='<span class="meh-line"><span class="meh-cip">👷 '+esc(r.ime)+' <button class="cip-x" onclick="PLAN.makniRadnikaIz('+o.id+','+r.id+','+idsStr2+')" title="Makni s operacije">✕</button></span>'+tHtml+'</span>';
          });
          h+='</span>';
        }
        // „＋" za dodavanje još jednog mehaničara i kad operacija već traje (u tijeku / čeka / čeka dio).
        if(o.status!=="gotovo"){
          var postojeciIds=dod2.map(function(r){return r.id;});
          var idsStrR='['+postojeciIds.join(',')+']';
          h+='<span class="meh-add-wrap">'
            +'<button class="meh-add" title="Dodaj još jednog mehaničara" onclick="PLAN.pokaziDodaj(this)">＋</button>'
            +'<select class="meh-add-sel" style="display:none" onchange="PLAN.dodajRadnika('+o.id+',this.value,'+idsStrR+')">'+mehOptsExcept(postojeciIds)+'</select>'
            +'</span>';
        }
        if(o.status==="dijelovi") h+=' <button class="btn ghost sm" onclick="PLAN.dioStigao('+o.id+')">📦 Dio stigao</button>';
      }
      h+='</span></div>';
    });
    h+='</div></div>';
    return h;
  }
  function renderPL(){
    var aktSvi=nalozi.filter(function(n){return !n.cekaDijelove && !nalogZavrsen(n) && n.rang!=null;});
    var _cmp=function(a,b){
      var ar=(a.rang==null), br=(b.rang==null);
      if(ar!==br) return ar?1:-1;                 // u planu (ručni redoslijed) ide prvo
      if(!ar) return a.rang-b.rang;               // po utipkanom redoslijedu
      return napredak(b).pct - napredak(a).pct;   // ostali po dovršenosti
    };
    var hitni=aktSvi.filter(function(n){return n.hitno;}).sort(_cmp);
    var norm=aktSvi.filter(function(n){return !n.hitno;}).sort(_cmp);
    var ceka=nalozi.filter(function(n){return n.cekaDijelove;});
    var h='';
    h+='<div class="pl-top">'+
         (planZakljucan?'':'<button class="btn sm" onclick="PLAN.isplanirajSve()" title="Pošalji sve naloge iz plana odjednom — svakom mehaničaru njegov prvi zadatak">📨 Pošalji sve naloge</button>')+
         autoSlanjeHtml()+
         (planZakljucan?'':'<button class="btn ghost sm" onclick="PLAN.planMode(true)">➕ Dodaj vozilo</button>')+
         '<button class="btn ghost sm" onclick="PLAN.zakljucaj()">'+(planZakljucan?'🔓 Otključaj plan':'🔒 Zaključaj plan')+'</button>'+
         '<button class="brojac-btn" onclick="PLAN.toggleLog()">Promjena plana danas: '+promjene+' '+(logOtvoren?'▴':'▾')+'</button>'+
       '</div>';
    // (Pregled „Napravljeno danas" je sad zaseban tab — vidi renderNAP.)
    if(planZakljucan){
      h+='<div class="zak-traka">🔒 Plan zaključan'+(zakljucaoIme?' · '+esc(zakljucaoIme):'')+(zakljucanoTs?' · '+vrijemeHM(zakljucanoTs):'')+' — sastav i redoslijed su zamrznuti. Dnevni rad (dodjela, slanje, štoperica) teče normalno.</div>';
    }
    if(_planMode){
      h+='<div class="plan-maker"><span class="pm-lbl">Upiši garažni broj + Enter (redom):</span>'+
         '<input id="gb-unos" placeholder="npr. 97" autocomplete="off" onkeydown="PLAN.gbKey(event,this)">'+
         '<button class="btn ghost sm" onclick="PLAN.planMode(false)">Gotovo</button></div>';
    }
    if(logOtvoren){
      h+='<div class="log-pop"><div class="log-h">Promjene plana danas ('+promjeneLog.length+')</div>';
      if(promjeneLog.length){ for(var li=promjeneLog.length-1; li>=0; li--){ h+='<div class="log-row"><span class="log-t">'+vrijemeHM(promjeneLog[li].t)+'</span><span>'+esc(promjeneLog[li].tekst)+'</span></div>'; } }
      else h+='<div class="vozilo" style="padding:4px 0">Još nema promjena plana danas.</div>';
      h+='</div>';
    }
    // Prisutni mehaničari bez ijednog (nezavršenog) zadatka — da poslovođa vidi tko je slobodan.
    var _zauzeti={};
    nalozi.forEach(function(n){ (n.ops||[]).forEach(function(o){ if(o.status!=="gotovo"){ (o.mehIds||[]).forEach(function(id){ _zauzeti[id]=1; }); } }); });
    var slobodniR=(MEH||[]).filter(function(m){ return !m.odsutan && !_zauzeti[m.id]; }).sort(function(a,b){ return a.ime<b.ime?-1:1; });
    h+='<div class="sek-nas">🙋 Prisutni bez zadatka ('+slobodniR.length+')</div>';
    if(slobodniR.length){ h+='<div class="card slob-card">'+slobodniR.map(function(m){ return '<span class="slob-cip">👷 '+esc(m.ime)+'</span>'; }).join('')+'</div>'; }
    else{ h+='<div class="card" style="color:var(--muted)">Svi prisutni mehaničari imaju zadatak.</div>'; }
    h+='<div class="sek-nas hitno-head">🔴 Hitno — preskače red</div>';
    if(hitni.length){ hitni.forEach(function(n){ h+=nalogCard(n,"🔴",null,"hit"); }); }
    else{ h+='<div class="card" style="color:var(--muted)">Nema hitnih. Označi kamion s 🔴 kad je stvarno hitno.</div>'; }
    h+='<div class="sek-nas">Plan za danas</div>';
    if(norm.length){ h+='<div id="plan-norm">'; norm.forEach(function(n,i){ h+=nalogCard(n,(i+1),{first:i===0,last:i===norm.length-1},"norm"); }); h+='</div>'; }
    else{ h+='<div class="card" style="color:var(--muted)">Plan je prazan. Klikni <b>➕ Dodaj vozilo</b> i upiši garažne brojeve redom.</div>'; }

        n.ops.forEach(function(o){ h+='<div class="op"><span class="opn">'+esc(o.naziv)+'</span></div>'; });
        h+='</div></div>';
      });
    }
    // Fiksni bočni popis (desno) — brzi skok do naloga u planu (hitni pa plan).
    var idxItems='';
    hitni.forEach(function(n){ idxItems+='<button class="plan-idx-it hit" title="Hitno — GB '+esc(n.gb)+' · '+esc(n.vozilo)+'" onclick="PLAN.skrolDo('+n.id+')">'+esc(n.gb)+'</button>'; });
    norm.forEach(function(n){ idxItems+='<button class="plan-idx-it" title="GB '+esc(n.gb)+' · '+esc(n.vozilo)+'" onclick="PLAN.skrolDo('+n.id+')">'+esc(n.gb)+'</button>'; });
    if(idxItems){ h+='<div class="plan-idx"><div class="plan-idx-h">Plan</div>'+idxItems+'</div>'; }
    // Fiksni popis mehaničara (lijevo): broj zadataka u redu, najmanje → najviše;
    // crveno = nije prijavljen ni na jedan zadatak (ništa „U tijeku").
    var rpr=redPoRadniku();
    // Prikaži SVE (i odsutne) — da im se status može vratiti na Dostupan odavde.
    var mehL=(MEH||[]).map(function(m){
      var l=rpr[m.id]||[];
      return {m:m, br:l.length, radi:l.some(function(x){ return x.o.status==="radu"; }), ods:m.odsutnost||(m.odsutan?'odsutan':'')};
    }).sort(function(a,b){
      // Teren na vrh (aktivni, vani), pa prisutni po broju, pa odsutni (godišnji/bolovanje/odsutan) na dno.
      function grp(x){ return x.ods==='teren' ? 0 : (x.ods ? 2 : 1); }
      var ga=grp(a), gbv=grp(b);
      return ga!==gbv ? ga-gbv : (a.br!==b.br ? a.br-b.br : (a.m.ime<b.m.ime?-1:1));
    });
    function statEmo(ods){ return ods==='godisnji'?'🌴 ':ods==='bolovanje'?'🤒 ':ods==='odsutan'?'⛔ ':ods==='teren'?'🚜 ':''; }
    function statMenu(x){
      var opt=function(v,txt){ return '<button type="button" class="mi-opt'+(x.ods===v?' sel':'')+'" onclick="PLAN.postaviStatus('+x.m.id+',\''+v+'\')">'+txt+'</button>'; };
      return '<div class="mi-menu" id="stat-'+x.m.id+'">'+
             opt('','✅ Dostupan')+opt('teren','🚜 Teren')+opt('godisnji','🌴 Godišnji')+opt('bolovanje','🤒 Bolovanje')+opt('odsutan','⛔ Odsutan')+
             '</div>';
    }
    if(mehL.length){
      h+='<div class="meh-idx"><div class="meh-idx-h">Mehaničari · zadataka</div>'+
         mehL.map(function(x){
           var kls = x.ods==='teren' ? ' te' : (x.ods ? ' ods' : (x.radi?'':' nije'));
           return '<div class="meh-idx-it'+kls+'" title="'+esc(x.m.ime)+(x.ods?' — '+esc(x.ods):(x.radi?'':' — nije prijavljen na zadatak'))+'">'+
                  '<div class="mi-top"><button type="button" class="mi-ime" onclick="PLAN.toggleStat('+x.m.id+')">'+statEmo(x.ods)+esc(x.m.ime)+' <span class="mi-caret">▾</span></button><span class="mi-br">'+x.br+'</span></div>'+
                  statMenu(x)+'</div>';
         }).join('')+'</div>';
    }
    return h;
  }

  function nalogStanje(n){
    if(nalogZavrsen(n)) return "gotovo";                                   // sve operacije gotove
    if(n.cekaDijelove) return "dijelovi";                                  // blokiran — čeka dio
    var ops=n.ops;
    if(ops.some(function(o){return o.status==="radu";})) return "radu";    // netko trenutno radi
    if(ops.some(function(o){return o.status==="ceka";})) return "ceka";    // čeka potvrdu vlasnika
    if(ops.some(function(o){return o.status==="pauza";})) return "pauza";  // stoji (nije gotovo)
    if(nalogZapoceo(n)) return "pauza";                                    // započeo pa stoji
    return "plan";                                                         // još nije počeo
  }
  // „Radnici" — mehaničari u redcima, njihovi zadaci po redu čekanja u stupcima.
  function _faza(s){ return s==="radu"?0 : (s==="ceka"?1:2); }   // isti red kao dispečer
  function redPoRadniku(){
    var map={};
    nalozi.forEach(function(n){
      n.ops.forEach(function(o){
        if(o.status==="gotovo" || o.status==="dijelovi" || o.status==="nedostupan") return;   // gotovo, "čeka dio" i "nedostupan" nisu u aktivnom redu
        (o.mehIds||[]).forEach(function(id){ (map[id]=map[id]||[]).push({n:n,o:o}); });
      });
    });
    Object.keys(map).forEach(function(id){
      map[id].sort(function(a,b){
        // isti red kao dispečer (_red/kljuc): u tijeku prvi, pa hitno, pa RUČNI red (o.red),
        // pa čeka-potvrdu i rang kao tiebreak za one bez ručnog reda.
        var ga=(a.o.status==="radu"?0:(a.n.hitno?1:2)), gb=(b.o.status==="radu"?0:(b.n.hitno?1:2)); if(ga!==gb) return ga-gb;
        var ra=(a.o.red==null?1e6:a.o.red), rb=(b.o.red==null?1e6:b.o.red); if(ra!==rb) return ra-rb;
        var ca=(a.o.status==="ceka"?0:1), cb=(b.o.status==="ceka"?0:1); if(ca!==cb) return ca-cb;
        var na=(a.n.rang==null?9999:a.n.rang), nb=(b.n.rang==null?9999:b.n.rang); if(na!==nb) return na-nb;
        return a.o.id-b.o.id;
      });
    });
    return map;
  }
  function renderDASH(){
    var PRAG=2;
    var map=redPoRadniku();
    var saZad=[], slobodniPrisutni=[], slobodniOdsutni=[];
    MEH.forEach(function(m){
      // Odsutni (godišnji/bolovanje/odsutan) se NE prikazuju u redovima — samo u podnožju.
      // Teren ostaje (radi, samo vani).
      if(m.odsutan && m.odsutnost!=='teren'){ slobodniOdsutni.push(m); return; }
      var l=map[m.id]||[];
      if(l.length) saZad.push({m:m,lista:l}); else slobodniPrisutni.push(m);   // prisutni bez zadatka → vrh, crveno
    });
    // Uvijek poredano: najmanje zadataka → najviše (tko ima manje je gore, za dopunu);
    // isti broj → abecedno.
    saZad.sort(function(a,b){
      if(a.lista.length!==b.lista.length) return a.lista.length-b.lista.length;
      return a.m.ime<b.m.ime?-1:(a.m.ime>b.m.ime?1:0);
    });
    var ukupno=0, trebaDopunu=0;
    saZad.forEach(function(r){
      ukupno+=r.lista.length;
      r.cekaju=r.lista.filter(function(x){return x.o.status==="plan"||x.o.status==="pauza";}).length;
      if(r.cekaju<PRAG) trebaDopunu++;
    });
    var h='';
    h+='<div class="kpis">'+
       '<div class="kpi"><div class="n">'+saZad.length+'</div><div class="l">Radnika sa zadacima</div></div>'+

       '<div class="kpi"><div class="n"'+(trebaDopunu>0?' style="color:var(--s-ceka)"':'')+'>'+trebaDopunu+'</div><div class="l">Za dopunu (&lt;'+PRAG+')</div></div>'+
       '<div class="kpi"><div class="n">'+slobodniPrisutni.length+'</div><div class="l">Slobodnih</div></div>'+

    if(!saZad.length && !slobodniPrisutni.length){
      h+='<div class="card" style="color:var(--muted)">Nijedan mehaničar nema dodijeljene zadatke. Dodijeli ih u pogledu Poslovođa.</div>';
    } else {

      slobodniPrisutni.forEach(function(m){
        h+='<div class="rad-row"><div class="rad-ime slob-top"><div class="ri-top">⚠ <span class="ri-ime">'+esc(m.ime)+'</span><span class="rad-br">0</span></div></div>'+

      });
      saZad.forEach(function(r){
        var malo=r.cekaju<PRAG;
        var nije=!r.lista.some(function(x){ return mehStatus(x.o, r.m.id)==="radu"; });   // ON nigdje ne radi → crveno
        // Prvi zadatak koji mu se može (ponovno) poslati = prvi koji ON ne radi.
        var zaSlanje=null; for(var si=0;si<r.lista.length;si++){ if(mehStatus(r.lista[si].o, r.m.id)!=="radu"){ zaSlanje=r.lista[si].o.id; break; } }
        var sendBtn = zaSlanje ? '<button class="rad-send" onclick="PLAN.posaljiMeh(event,'+zaSlanje+')" title="Pošalji (opet) poveznicu ovom mehaničaru">📨 Pošalji</button>' : '';
        var prijaviBtn = zaSlanje ? '<button class="rad-prijavi" onclick="PLAN.prijaviRucno(event,'+zaSlanje+','+r.m.id+')" title="Ručno prijavi mehaničara na zadatak (računa se kao prekršaj jer nije sam kliknuo)">✍️ Prijavi</button>' : '';
        h+='<div class="rad-row"><div class="rad-ime'+(nije?' nije':(malo?' malo':''))+'"'+(nije?' title="Nije prijavljen na zadatak"':'')+'><div class="ri-top">'+(malo?'⚠ ':'')+'<span class="ri-ime">'+esc(r.m.ime)+'</span><span class="rad-br">'+r.lista.length+'</span></div>'+sendBtn+prijaviBtn+'</div><div class="rad-cells" data-rid="'+r.m.id+'">';

  function _planDrag(e){

    if(!cont||!card) return;
    e.preventDefault(); e.stopPropagation();
    _drag=true; card.classList.add("dragging");
    // Slušatelji na DOCUMENT (ne na ručku): pointer tijekom povlačenja ide po elementu
    // ispod kursora, a i setPointerCapture se otpusti kad karticu premjestimo u DOM-u.
    // touch-action:none na ručki spriječi skrol na dodir pa potezi dolaze kao pointermove.
    function onMove(ev){
      if(ev.cancelable) ev.preventDefault();
      var y=ev.clientY, cards=cont.querySelectorAll(".card.nalog"), before=null;
      for(var i=0;i<cards.length;i++){ var c=cards[i]; if(c===card) continue; var r=c.getBoundingClientRect(); if(y < r.top + r.height/2){ before=c; break; } }
      if(before){ if(card.nextSibling!==before) cont.insertBefore(card, before); }
      else if(cont.lastChild!==card){ cont.appendChild(card); }
    }
    function end(){
      document.removeEventListener("pointermove",onMove,true);
      document.removeEventListener("pointerup",end,true);
      document.removeEventListener("pointercancel",end,true);
      card.classList.remove("dragging"); _drag=false; _plan_commit_red();
    }
    document.addEventListener("pointermove",onMove,true);
    document.addEventListener("pointerup",end,true);

    var zids=[]; cont.querySelectorAll(".rad-cell").forEach(function(c){ var z=parseInt(c.getAttribute("data-zid"),10); if(z) zids.push(z); });
    if(!rid||!zids.length) return;
    api("/meh-redoslijed","POST",{radnik_id:rid, zadaci:zids}).then(ucitaj).catch(function(e){ toast(e.message||"Greška"); ucitaj(); });
  }
  // Pokreni stvarno povlačenje kartice (zajedničko za desktop ručku i mobitel long-press).
  function _beginDashDrag(card, cont){
    _drag=true; card.classList.add("dragging"); card.classList.remove("drag-arm");
    var izvor=cont;                       // redak (mehaničar) iz kojeg je kartica krenula
    card.style.pointerEvents="none";      // da elementFromPoint vidi redak ISPOD kartice
    function onMove(ev){
      if(ev.cancelable) ev.preventDefault();
      // Kartica smije i u redak DRUGOG mehaničara (redak ispod prsta/miša).
      var pod=document.elementFromPoint(ev.clientX, ev.clientY);
      var red=pod && pod.closest(".rad-row"), novi=red && red.querySelector(".rad-cells[data-rid]");
      if(novi && novi!==cont){ cont=novi; }
      var x=ev.clientX, cells=cont.querySelectorAll(".rad-cell:not(.prazno)"), before=null;
      for(var i=0;i<cells.length;i++){ var c=cells[i]; if(c===card) continue; var r=c.getBoundingClientRect(); if(x < r.left + r.width/2){ before=c; break; } }
      if(before){ if(card.nextSibling!==before) cont.insertBefore(card, before); }
      else if(cont.lastChild!==card){ cont.appendChild(card); }
      var ph=cont.querySelector(".rad-cell.prazno"); if(ph) ph.style.display="none";
    }
    function end(){
      document.removeEventListener("pointermove",onMove,true);
      document.removeEventListener("pointerup",end,true);
      document.removeEventListener("pointercancel",end,true);
      card.classList.remove("dragging"); card.style.pointerEvents=""; _drag=false;
      // progutaj klik koji dolazi nakon povlačenja (da se ne otvori nalog)
      var eat=function(ev){ ev.preventDefault(); ev.stopPropagation(); document.removeEventListener("click",eat,true); };
      document.addEventListener("click",eat,true);
      setTimeout(function(){ document.removeEventListener("click",eat,true); }, 500);
      if(cont===izvor){ _dash_commit(cont); return; }
      // Preseljeno drugom mehaničaru → prebaci zadatak + složi njegov red.
      var zids=[]; cont.querySelectorAll(".rad-cell").forEach(function(c){ var z=parseInt(c.getAttribute("data-zid"),10); if(z) zids.push(z); });
      api("/premjesti","POST",{
        zadatak_id:parseInt(card.getAttribute("data-zid"),10),
        s_radnika:parseInt(izvor.getAttribute("data-rid"),10),
        na_radnika:parseInt(cont.getAttribute("data-rid"),10),
        redoslijed:zids
      }).then(function(){ toast("Zadatak prebačen"); ucitaj(); }).catch(function(e){ toast(e.message||"Greška"); ucitaj(); });
    }
    document.addEventListener("pointermove",onMove,true);
    document.addEventListener("pointerup",end,true);
    document.addEventListener("pointercancel",end,true);
  }
  function _dashStart(e){
    var card=e.target.closest(".rad-cell"); if(!card) return;
    var cont=card.closest(".rad-cells"); if(!cont) return;
    if(!card.querySelector(".rc-drag")) return;   // „u tijeku" / nepomična kartica
    if(e.pointerType!=="touch"){
      // DESKTOP: samo preko ručke ⠿, kreni odmah
      if(!e.target.closest(".rc-drag")) return;
      e.preventDefault(); e.stopPropagation();
      _beginDashDrag(card, cont);
      return;
    }
    // MOBITEL: drži 0,5 s na kartici pa povuci. Pomak prije toga = skrol (odustani).
    var sx=e.clientX, sy=e.clientY, krenulo=false;
    card.classList.add("drag-arm");
    var timer=setTimeout(function(){
      krenulo=true; cleanup();
      if(navigator.vibrate){ try{ navigator.vibrate(30); }catch(_){ } }
      _beginDashDrag(card, cont);
    }, 500);
    function pm(ev){ if(krenulo) return; if(Math.abs(ev.clientX-sx)>10 || Math.abs(ev.clientY-sy)>10){ clearTimeout(timer); card.classList.remove("drag-arm"); cleanup(); } }
    function pu(){ clearTimeout(timer); card.classList.remove("drag-arm"); cleanup(); }
    function cleanup(){ document.removeEventListener("pointermove",pm,true); document.removeEventListener("pointerup",pu,true); document.removeEventListener("pointercancel",pu,true); }
    document.addEventListener("pointermove",pm,true);
    document.addEventListener("pointerup",pu,true);
    document.addEventListener("pointercancel",pu,true);
  }
  document.getElementById("v-dash").addEventListener("pointerdown", _dashStart);

  render();
  ucitaj();                        // početni dohvat stvarnih podataka
  setInterval(tick,1000);          // živi mjerači
  setInterval(function(){ if(!_busy && !_planMode && !_drag && !korisnikBira()) ucitaj(); }, 8000);  // osvježi iz baze (ne dok slažeš plan / biraš radnika / povlačiš)
})();
</script>
